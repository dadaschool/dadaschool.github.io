<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 데이터가 밖으로 나가지 않게: 이 사이트 밖으로는 연결 자체를 못 하게 막는다 (설계서 「6-4」) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; media-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<title>가계부</title>
<meta name="description" content="혼자 쓰는 가계부 — 데이터는 내 휴대폰에만 저장돼요">
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root {
  --bg: #f3f5f4; --card: #ffffff; --text: #18211d; --muted: #5d6964; --line: #e0e5e2; --soft: #edf1ef;
  --brand: #16775c; --brand-ink: #ffffff; --brand-soft: #e1f0e9;
  --exp: #cc3d34; --inc: #2360c4; --sav: #16775c; --warn: #b8660f; --danger: #c23a32;
  --warn-bg: #fff4e2; --warn-ink: #6e4300;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s-other: #b9b7b0; --grid: #e6e9e7;
  --radius: 16px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1412; --card: #17201c; --text: #e4ebe7; --muted: #98a49f; --line: #28332e; --soft: #1f2a25;
    --brand: #3db38a; --brand-ink: #08170f; --brand-soft: #173329;
    --exp: #ff7d73; --inc: #7fabff; --sav: #3db38a; --warn: #f2a54d; --danger: #ff7d73;
    --warn-bg: #3a2a12; --warn-ink: #ffd9a3; --shadow: none;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s-other: #5f5e5a; --grid: #26302c;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  word-break: keep-all; overflow-wrap: anywhere;
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent;
}
.num, .amt { font-variant-numeric: tabular-nums; }
a { color: var(--brand); }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
h1 { font-size: 22px; margin: 4px 0 14px; }
p { margin: 6px 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.right { text-align: right; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

header.top {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
  padding: calc(8px + env(safe-area-inset-top)) 12px 8px 16px; background: var(--bg);
  max-width: 560px; margin: 0 auto;
}
.book-btn {
  display: flex; align-items: center; gap: 8px; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 20px;
  padding: 6px 10px 6px 4px; margin-left: -4px; min-height: 44px; cursor: pointer; border-radius: 12px; min-width: 0; max-width: calc(100% - 52px);
}
.book-btn b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.book-btn .caret { font-size: 13px; color: var(--muted); }
.page-sub { font-size: 14px; color: var(--muted); margin: -8px 0 12px; }
.icon-btn {
  position: relative; width: 44px; height: 44px; display: grid; place-items: center; color: var(--text);
  border: 0; background: transparent; border-radius: 12px; cursor: pointer; font: inherit; text-decoration: none;
}
.icon-btn svg { width: 24px; height: 24px; }
.dot { position: absolute; top: 9px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--danger); }

#bars { max-width: 560px; margin: 0 auto; padding: 0 16px; }
.bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 12px; font-size: 14px; margin-bottom: 8px; }
.bar.dev { background: var(--brand-soft); }
.bar.warn { background: var(--warn-bg); color: var(--warn-ink); }

main { max-width: 560px; margin: 0 auto; padding: 4px 16px 88px; outline: none; }   /* 아래 88px: ＋ 단추에 가리지 않게 */
.card { background: var(--card); border-radius: var(--radius); padding: 16px; margin: 0 0 12px; box-shadow: var(--shadow); }
.card > h2 { font-size: 15px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }

nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: center;
  background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs a {
  flex: 1; max-width: 140px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0 10px; font-size: 12px; color: var(--muted); text-decoration: none;
}
nav.tabs a svg { width: 24px; height: 24px; }
nav.tabs a[aria-current="page"] { color: var(--brand); font-weight: 700; }

.btn {
  appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 12px; padding: 10px 16px; font: inherit; font-weight: 600; min-height: 46px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
}
.btn.small { white-space: nowrap; flex: none; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.danger { color: var(--danger); border-color: currentColor; background: transparent; }
.btn.block { width: 100%; }
.btn.small { min-height: 36px; padding: 5px 12px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: default; }
.btns { display: grid; gap: 8px; margin-top: 12px; }
.btns.two { grid-template-columns: 1fr 1fr; }

.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); min-height: 52px; }
.row:first-of-type { border-top: 0; }
a.row, button.row { color: inherit; text-decoration: none; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; font: inherit; text-align: left; cursor: pointer; }
.row .ico { font-size: 22px; width: 32px; text-align: center; flex: none; }
.row .grow { flex: 1; min-width: 0; }
.row .sub { display: block; font-size: 13px; color: var(--muted); }
.row.off { opacity: .55; }
.chev { color: var(--muted); font-size: 22px; line-height: 1; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.ok { color: var(--brand); font-weight: 700; }

.field { display: block; margin: 12px 0; }
.field > span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
input[type=text], input[type=number], input[type=search], input[type=date], select, textarea {
  width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--bg); color: var(--text); min-height: 46px;
}
.seg { display: flex; background: var(--soft); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; font: inherit; padding: 6px 4px; border-radius: 10px; color: var(--muted); min-height: 40px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--text); font-weight: 700; box-shadow: var(--shadow); }
.check { display: flex; gap: 10px; align-items: center; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--brand); }

.emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 6px; }
.emoji-grid button { font-size: 22px; aspect-ratio: 1; border: 1px solid transparent; background: var(--soft); border-radius: 10px; cursor: pointer; padding: 0; }
.emoji-grid button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }

dialog.sheet {
  border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92vh; overflow: auto;
  border-radius: 20px 20px 0 0; background: var(--card); color: var(--text);
}
dialog.sheet::backdrop { background: rgba(0,0,0,.45); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 8px 4px 16px; position: sticky; top: 0; background: var(--card); z-index: 1; }
.sheet-head h2 { font-size: 18px; margin: 0; }
.sheet-body { padding: 4px 16px calc(18px + env(safe-area-inset-bottom)); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(148px + env(safe-area-inset-bottom));
  background: #1f2a25; color: #fff; padding: 12px 16px; border-radius: 12px; display: flex; gap: 14px; align-items: center;
  z-index: 50; width: max-content; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.25); font-size: 15px;
}
.toast button { background: none; border: 0; color: #8fe0bf; font: inherit; font-weight: 700; cursor: pointer; padding: 4px; }

/* ＋ 단추 · 입력 · 내역 */
.fab {
  position: fixed; right: max(16px, calc(50% - 264px)); bottom: calc(78px + env(safe-area-inset-bottom)); z-index: 6;
  width: 58px; height: 58px; border-radius: 50%; background: var(--brand); color: var(--brand-ink);
  display: grid; place-items: center; font-size: 32px; line-height: 1; text-decoration: none; box-shadow: 0 4px 14px rgba(0,0,0,.22);
}
.amount-wrap { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line); padding: 2px 0; }
.amount-wrap:focus-within { border-color: var(--brand); }
input.amount-in { border: 0; background: transparent; font-size: 34px; font-weight: 700; text-align: right; padding: 0; min-height: 54px; flex: 1; min-width: 0; color: var(--text); font-variant-numeric: tabular-nums; }
input.amount-in:focus { outline: none; }
.amount-wrap .unit { font-size: 20px; color: var(--muted); }
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.cat-grid button {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px; border: 1px solid var(--line); background: var(--card);
  border-radius: 12px; font: inherit; font-size: 12px; line-height: 1.25; color: var(--text); cursor: pointer; min-height: 64px;
}
.cat-grid button .e { font-size: 22px; line-height: 1.1; }
.cat-grid button[aria-pressed="true"], .chip[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 99px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; min-height: 38px; }
.chip.freq { background: var(--soft); border-color: transparent; }
.date-row { display: flex; gap: 6px; align-items: center; }
.date-row input { flex: 1; min-width: 0; }
.day-head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--muted); margin: 0 0 2px; }
.day-head b { color: var(--text); }
a.row.tx { min-height: 56px; }
.row.tx .grow { line-height: 1.35; }
.row.tx .amt { font-weight: 700; white-space: nowrap; }
.row.tx.part { opacity: .8; }
.list-sum { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 15px; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }

/* 예산 */
.bar-track { height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; margin: 6px 0; }
.bar-track.thin { height: 6px; margin: 4px 0 0; }
.bar-track > i { display: block; height: 100%; border-radius: 99px; background: var(--brand); }
.bar-track > i.warn { background: var(--warn); }
.bar-track > i.over { background: var(--danger); }
.bud-big { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.bud-big b { font-size: 22px; }
.bud-cat { padding: 10px 0; border-top: 1px solid var(--line); }
.bud-cat:first-of-type { border-top: 0; }
.bud-cat .top { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
.bud-cat .top .pct { font-weight: 700; }
.pct.warn, .warn-t { color: var(--warn); } .pct.over, .over-t { color: var(--danger); }
.day-money { background: var(--brand-soft); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
.day-money b { font-size: 20px; }
.bud-row { display: grid; grid-template-columns: 32px 1fr 140px; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.bud-row:first-of-type { border-top: 0; }
.bud-row .ico { font-size: 22px; text-align: center; }
.bud-row input { text-align: right; font-variant-numeric: tabular-nums; }
.bud-row .sub { font-size: 12px; color: var(--muted); display: block; }

/* 반복 · 카드 */
.occ { padding: 10px 0; border-top: 1px solid var(--line); }
.occ:first-of-type { border-top: 0; }
.occ .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.occ .acts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.occ.late .when { color: var(--warn); font-weight: 700; }
.row.tx.plan { opacity: .62; border-style: dashed; }
.badge.plan { background: var(--brand-soft); color: var(--brand); }
.cardpay { padding: 10px 0; border-top: 1px solid var(--line); }
.cardpay:first-of-type { border-top: 0; }
.cardpay .line { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 3px 0; }
.cardpay .line .amt { font-weight: 700; }
.recur-pv { background: var(--soft); border-radius: 12px; padding: 10px 12px; margin-top: 8px; font-size: 14px; }

/* 분석 · 목돈 */
.segbar { display: flex; gap: 2px; height: 28px; margin: 6px 0 8px; }
.segbar > span { border-radius: 4px; min-width: 3px; display: flex; align-items: center; padding-left: 6px; font-size: 12px; font-weight: 700; overflow: hidden; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); margin: 4px 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.rank { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; font: inherit; color: inherit; cursor: pointer; }
.rank:first-of-type { border-top: 0; }
.rank .top { display: flex; justify-content: space-between; gap: 8px; }
.rank .bar-track > i { background: var(--s1); }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .axis { font-size: 10px; fill: var(--muted); }
.chart-detail { font-size: 14px; margin: 6px 0 0; min-height: 2.6em; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.tbl th, table.tbl td { padding: 6px 4px; border-top: 1px solid var(--line); text-align: right; }
table.tbl th:first-child, table.tbl td:first-child { text-align: left; }
.goal-num { font-size: 22px; font-weight: 700; }
.pred { margin: 4px 0; padding-left: 0; list-style: none; }
.pred li { padding: 6px 0; border-top: 1px solid var(--line); font-size: 15px; }
.pred li:first-child { border-top: 0; }
.calc-out { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin-top: 10px; font-size: 15px; }
.calc-out .amt { text-align: right; font-variant-numeric: tabular-nums; }
.calc-out .total { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 700; font-size: 17px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* 잠금 */
body.locked > header.top, body.locked > #bars, body.locked > main, body.locked > nav.tabs, body.locked > .fab, body.locked > .toast { visibility: hidden; }
#lock { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); overflow: auto; }
#lock img { width: 64px; height: 64px; border-radius: 16px; }
#lock h2 { margin: 4px 0 0; font-size: 20px; }
.pin-dots { display: flex; gap: 14px; margin: 10px 0 4px; }
.pin-dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); }
.pin-dots i.on { background: var(--text); border-color: var(--text); }
.pin-msg { min-height: 1.5em; font-size: 14px; color: var(--danger); text-align: center; }
.keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px 22px; margin-top: 6px; }
.keypad button { width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--card); color: var(--text); font: inherit; font-size: 26px; cursor: pointer; box-shadow: var(--shadow); }
.keypad button.fn { background: transparent; box-shadow: none; font-size: 15px; }
.keypad button:disabled { opacity: .4; }
.rc-code { font-family: ui-monospace, monospace; font-size: 24px; letter-spacing: 2px; text-align: center; padding: 14px; background: var(--soft); border-radius: 12px; margin: 10px 0; user-select: all; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

/* 홈 */
.period { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.period .label { text-align: center; flex: 1; }
.period .label b { font-size: 20px; display: block; }
.sum { display: grid; grid-template-columns: 1fr auto; gap: 6px 0; font-size: 17px; }
.sum .amt { text-align: right; padding-left: 12px; }
.sum .total { border-top: 1px solid var(--line); padding-top: 8px; font-weight: 700; }
.inc { color: var(--inc); } .exp { color: var(--exp); } .sav { color: var(--sav); }
.steps { list-style: none; padding: 0; margin: 0; }
.steps li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; }
.steps .mark { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; font-size: 14px; font-weight: 700; }
.steps li.done .mark { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.steps li.done .t { color: var(--muted); text-decoration: line-through; }
.soon { text-align: center; padding: 28px 16px; }
.soon .big { font-size: 44px; }
.soon ul { text-align: left; display: inline-block; margin: 8px 0 0; padding-left: 20px; color: var(--muted); }

details.note { margin-top: 10px; }
details.note summary { cursor: pointer; font-weight: 600; min-height: 36px; display: flex; align-items: center; }
details.note ul { margin: 6px 0; padding-left: 20px; }
.up-notes { margin: 6px 0; padding-left: 20px; }
.progress { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; margin: 8px 0; }
.progress > i { display: block; height: 100%; background: var(--brand); width: 0; }
.foot { text-align: center; font-size: 13px; color: var(--muted); margin: 18px 0 6px; }
.err { color: var(--danger); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<header class="top">
  <button class="book-btn" id="book-btn" type="button" aria-haspopup="dialog" aria-label="가계부 고르기"><span id="book-ico" aria-hidden="true">📒</span><b id="book-name">가계부</b><span class="caret" aria-hidden="true">▾</span></button>
  <a class="icon-btn" id="gear" href="#/settings" aria-label="설정">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    <span class="dot" id="gear-dot" hidden></span>

<script>
'use strict';
/* =========================================================================
   가계부 — 혼자 쓰는 안드로이드용 웹앱 (설계서 ledger/DESIGN.md)
   - 데이터는 이 휴대폰 크롬 안(IndexedDB)에만. 서버로 보내지 않는다.
   - 화면 · CSS · JS 를 이 파일 하나에 둔다 (메인 사이트 «단일 파일» 규칙). sw.js · 매니페스트 · 아이콘만 따로.
   ========================================================================= */
const VERSION = '1.0.0';          // 판_만들기.py 가 판을 만들 때 덮어쓴다
const BUILD_DATE = '2026-11-11';  // 〃
const DATA_VERSION = 2;           // 기록 형식 판 — 바뀌면 migrate() 에 «더하기만» 하는 옮기기를 넣는다 (「6-5」). 2판: 가계부 여러 개

/* ───────────── 1. 작은 도구 ───────────── */
const $ = (s, el = document) => el.querySelector(s);
const view = $('#view');

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  let value;
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'value') value = v;
    else if (k === 'checked' || k === 'selected' || k === 'disabled' || k === 'hidden') el[k] = true;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  if (value !== undefined) el.value = value;   // select 는 option 을 넣은 뒤에 값을 정해야 한다
  return el;
}
// DOM 의 replaceChildren · append 는 null 을 «null» 글자로 넣으므로, 빈 칸(null · false)을 걸러서 넣는다
const fillEl = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nf = new Intl.NumberFormat('ko-KR');
const num = (n) => nf.format(Math.round(n || 0));
const won = (n) => num(n) + '원';

/* 날짜는 언제나 'YYYY-MM-DD' 글자로 다룬다 (시간대 문제 없음) */
const pad = (n) => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return { y, m, d }; };
const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();               // 그 달의 날 수 (m: 1~12)
const clampD = (y, m, d) => ymd(y, m, Math.min(d, dim(y, m)));                  // 그 달에 없는 날이면 말일
const addM = (y, m, k) => { const t = y * 12 + (m - 1) + k; return { y: Math.floor(t / 12), m: (t % 12 + 12) % 12 + 1 }; };
const addDays = (s, k) => { const { y, m, d } = parse(s); const t = new Date(Date.UTC(y, m - 1, d + k)); return ymd(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); };
const todayStr = () => { const n = new Date(); return ymd(n.getFullYear(), n.getMonth() + 1, n.getDate()); };
const weekday = (s) => { const { y, m, d } = parse(s); return '일월화수목금토'[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; };
const daysBetween = (a, b) => { const A = parse(a), B = parse(b); return Math.round((Date.UTC(B.y, B.m - 1, B.d) - Date.UTC(A.y, A.m - 1, A.d)) / 86400000); };
const mdDot = (s) => { const { m, d } = parse(s); return `${m}.${d}`; };
const mdKo = (s, wd) => { const { m, d } = parse(s); return `${m}월 ${d}일${wd ? `(${weekday(s)})` : ''}`; };
const fmtTime = (iso) => { const t = new Date(iso); return `${t.getFullYear()}.${t.getMonth() + 1}.${t.getDate()} ${pad(t.getHours())}:${pad(t.getMinutes())}`; };
const kb = (b) => (b >= 1024 * 1024 ? (b / 1024 / 1024).toFixed(1) + 'MB' : Math.max(1, Math.round(b / 1024)) + 'KB');

/* ───────────── 2. 한 달 기간 · 카드 이용 기간 (설계서 「4-1」 · 「4-4」) ─────────────
   시작일 S: «11월» = 11월 S일 ~ 12월 (S−1)일. S 가 그 달에 없으면 그 달 말일부터.        */
function cycleStartMonth(dateStr, S) {
  const { y, m, d } = parse(dateStr);
  return d >= Math.min(S, dim(y, m)) ? { y, m } : addM(y, m, -1);
}
function periodByMonth(y, m, S) {
  const n = addM(y, m, 1);
  return { key: `${y}-${pad(m)}`, y, m, start: clampD(y, m, S), end: addDays(clampD(n.y, n.m, S), -1) };
}
function periodOf(dateStr, S) { const { y, m } = cycleStartMonth(dateStr, S); return periodByMonth(y, m, S); }
function shiftPeriod(p, k, S) { const t = addM(p.y, p.m, k); return periodByMonth(t.y, t.m, S); }
// 카드: 이용 기간 = S일 ~ 다음 달 (S−1)일, 결제일 = 이용 기간이 끝난 뒤 처음 오는 P일
function cardCycle(dateStr, S, P) {
  const per = periodOf(dateStr, S);
  const e = parse(per.end);
  let pay = clampD(e.y, e.m, P);
  if (pay <= per.end) { const n = addM(e.y, e.m, 1); pay = clampD(n.y, n.m, P); }
  return { start: per.start, end: per.end, pay };
}
// 오늘 기준으로 아직 안 지난 결제 (마감된 이용 기간 것이 있으면 그것부터)
function upcomingCardCycles(S, P, base = todayStr()) {
  const cur = cardCycle(base, S, P);
  const prev = cardCycle(addDays(cur.start, -1), S, P);
  return prev.pay >= base ? [prev, cur] : [cur];
}

/* ───────────── 3. 저장 (IndexedDB · 설계서 「6-3」) ───────────── */
const DB_NAME = 'ledger';
const STORE_DEF = {
  books: { keyPath: 'id' },
  tx: { keyPath: 'id', indexes: { date: 'date', book_date: ['bookId', 'date'] } },
  categories: { keyPath: 'id' },
  methods: { keyPath: 'id' },
  budgets: { keyPath: 'key' },
  recurring: { keyPath: 'id' },
  goals: { keyPath: 'id' },
  settings: {},
  meta: {},
  backups: {},
};
const STORES = Object.keys(STORE_DEF);
const NO_BACKUP = new Set(['meta', 'backups']);   // 이 휴대폰에만 두는 것 (잠금 · 새 판 확인 · 마지막 백업 · 자동 백업)
const DATA_STORES = STORES.filter((s) => !NO_BACKUP.has(s));

let dbp = null;
function idbOpen(version) {
  return new Promise((resolve, reject) => {
    const rq = version ? indexedDB.open(DB_NAME, version) : indexedDB.open(DB_NAME);
    rq.onupgradeneeded = () => {
      const d = rq.result;
      for (const [name, def] of Object.entries(STORE_DEF)) {
        const os = d.objectStoreNames.contains(name) ? rq.transaction.objectStore(name)
          : def.keyPath ? d.createObjectStore(name, { keyPath: def.keyPath }) : d.createObjectStore(name);
        for (const [ix, kp] of Object.entries(def.indexes || {})) if (!os.indexNames.contains(ix)) os.createIndex(ix, kp);
      }
    };
    rq.onsuccess = () => resolve(rq.result);
    rq.onerror = () => reject(rq.error);
  });
}
function schemaOK(d) {
  for (const [name, def] of Object.entries(STORE_DEF)) {
    if (!d.objectStoreNames.contains(name)) return false;
    const ixs = Object.keys(def.indexes || {});
    if (ixs.length) { const os = d.transaction(name).objectStore(name); if (ixs.some((ix) => !os.indexNames.contains(ix))) return false; }
  }
  return true;
}
// 판 번호 없이 열고, 빠진 저장소 · 색인이 있을 때만 한 단계 올린다 —
// 예전 판 프로그램으로 되돌려도 «판이 더 낮다» 오류 없이 열린다 (「6-3」)
function openDB() {
  if (!dbp) dbp = (async () => {
    let d = await idbOpen();
    if (!schemaOK(d)) { const v = d.version + 1; d.close(); d = await idbOpen(v); }
    d.onversionchange = () => { d.close(); dbp = null; };
    return d;
  })().catch((e) => { dbp = null; throw e; });
  return dbp;
}
const reqP = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function readStore(name) { return (await openDB()).transaction(name).objectStore(name); }
// 쓰기는 거래(transaction)가 끝까지 저장된 뒤에 끝난 것으로 본다 — 바로 다시 열어도 사라지지 않게
async function write(names, fn) {
  const d = await openDB();
  return new Promise((resolve, reject) => {
    const t = d.transaction(names, 'readwrite');
    let out;
    t.oncomplete = () => resolve(out);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error || new Error('저장이 취소되었어요.'));
    try { out = fn(t); } catch (e) { try { t.abort(); } catch {} reject(e); }
  });
}
const db = {
  get: async (s, k) => reqP((await readStore(s)).get(k)),
  all: async (s) => reqP((await readStore(s)).getAll()),
  count: async (s) => reqP((await readStore(s)).count()),
  range: async (s, idx, lo, hi) => reqP((await readStore(s)).index(idx).getAll(IDBKeyRange.bound(lo, hi))),
  entries: async (s) => {
    const os = await readStore(s);
    const [keys, vals] = await Promise.all([reqP(os.getAllKeys()), reqP(os.getAll())]);
    return keys.map((k, i) => [k, vals[i]]);
  },
  put: (s, v, k) => write([s], (t) => { const os = t.objectStore(s); if (k === undefined) os.put(v); else os.put(v, k); }),
  putMany: (s, vals) => write([s], (t) => { const os = t.objectStore(s); for (const v of vals) os.put(v); }),
  del: (s, k) => write([s], (t) => t.objectStore(s).delete(k)),
};
const meta = { get: (k) => db.get('meta', k), set: (k, v) => db.put('meta', v, k), del: (k) => db.del('meta', k) };

/* 설정 */
/* 설정 — 앱 전체(S)와 지금 고른 가계부(BOOK). 한 달 시작일 · 분류 · 결제수단은 가계부마다 따로 (「4-9」) */
const DEFAULT_SETTINGS = { currentBook: null, backupRemindDays: 7, goalDefaults: { rate: 3.0, compound: 'simple', taxMode: 'normal', taxCustom: 15.4 } };
let S = { ...DEFAULT_SETTINGS };
let BOOK = { id: null, name: '가계부', icon: '📒', monthStart: 1, monthStartSet: false };
async function loadSettings() { S = { ...DEFAULT_SETTINGS, ...((await db.get('settings', 'main')) || {}) }; }
async function saveSettings(patch) { S = { ...S, ...patch }; await db.put('settings', S, 'main'); }
async function allBooks() { return (await db.all('books')).sort(byOrder); }
async function loadBook() {
  const books = await allBooks();
  BOOK = books.find((b) => b.id === S.currentBook) || books[0] || BOOK;
  if (BOOK.id && S.currentBook !== BOOK.id) await saveSettings({ currentBook: BOOK.id });
  drawHeader();
}
async function saveBook(patch) { BOOK = { ...BOOK, ...patch }; await db.put('books', BOOK); drawHeader(); }
function drawHeader() {
  $('#book-ico').textContent = BOOK.icon || '📒';
  $('#book-name').textContent = BOOK.name || '가계부';
  document.title = `${BOOK.name || '가계부'} · 가계부`;
}
const ofBook = (rows) => rows.filter((r) => r.bookId === BOOK.id);
const bookTx = (bookId, lo = '0000-00-00', hi = '9999-99-99') => db.range('tx', 'book_date', [bookId, lo], [bookId, hi]);

/* 처음 열 때 넣는 기본 분류 · 결제수단 (설계서 「2-2」 · 「2-3」) */
const TYPES = { expense: '지출', income: '수입', saving: '저축' };
const DEFAULT_CATS = {
  expense: [['🍚', '식비'], ['☕', '카페·간식'], ['🧴', '생활용품'], ['🚌', '교통·차량'], ['🏠', '주거·관리비'], ['📱', '통신'],
    ['💊', '의료·건강'], ['📚', '교육'], ['🎬', '문화·여가'], ['👕', '의류·미용'], ['🎁', '경조사·선물'], ['🛡️', '보험'],
    ['🧾', '세금·공과금'], ['📦', '기타']],
  income: [['💼', '급여'], ['💰', '부수입'], ['🎈', '용돈'], ['📈', '이자·배당'], ['↩️', '환급'], ['📦', '기타']],
  saving: [['🏦', '적금'], ['💵', '예금'], ['📊', '투자'], ['🧓', '연금'], ['🛟', '비상금'], ['📦', '기타']],
};
const KINDS = {
  cash: { label: '현금', icon: '💵' }, account: { label: '계좌이체', icon: '🏦' },
  debit: { label: '체크카드', icon: '💳' }, credit: { label: '신용카드', icon: '💳' },
};
const newBook = (name, icon, monthStart = 1, order = 0, extra = {}) =>
  ({ id: 'b-' + uid(), name, icon, monthStart, monthStartSet: false, order, createdAt: new Date().toISOString(), ...extra });
function putDefaultCatsMethods(t, bookId) {
  for (const [type, list] of Object.entries(DEFAULT_CATS)) {
    list.forEach(([icon, name], i) => t.objectStore('categories').put({ id: 'c-' + uid(), bookId, type, name, icon, order: i, hidden: false }));
  }
  [['현금', 'cash'], ['계좌이체', 'account']].forEach(([name, kind], i) =>
    t.objectStore('methods').put({ id: 'm-' + uid(), bookId, name, kind, order: i, hidden: false }));
}
async function seedIfEmpty() {
  if (await db.get('settings', 'main')) return;
  const book = newBook('내 가계부', '📒');
  await write(['books', 'categories', 'methods', 'settings'], (t) => {
    t.objectStore('books').put(book);
    putDefaultCatsMethods(t, book.id);
    t.objectStore('settings').put({ ...DEFAULT_SETTINGS, currentBook: book.id, createdAt: new Date().toISOString() }, 'main');
  });
}
// 기록 형식 옮기기 — 칸을 «더하기만» 한다 (설계서 「6-3」 · 「6-5」)
const BOOK_STORES = ['categories', 'methods', 'tx', 'recurring', 'goals', 'budgets'];
async function migrate() {
  const cur = (await meta.get('dataVersion')) || 0;
  if (cur < 2) await migrateTo2();
  if (cur < DATA_VERSION) await meta.set('dataVersion', DATA_VERSION);
}
// 1판 → 2판: 가계부가 하나뿐이던 기록을 «내 가계부» 로 묶는다 (한 달 시작일도 가계부로 옮겨 적음)
async function migrateTo2() {
  const books = await db.all('books');
  const main = await db.get('settings', 'main');
  const lacking = {};
  for (const n of BOOK_STORES) lacking[n] = (await db.all(n)).filter((r) => !r.bookId);
  if (books.length && !Object.values(lacking).some((a) => a.length)) return;
  let book = books[0];
  await write(['books', 'settings', ...BOOK_STORES], (t) => {
    if (!book) {
      book = newBook('내 가계부', '📒', (main && main.monthStart) || 1, 0, { monthStartSet: !!(main && main.monthStartSet) });
      t.objectStore('books').put(book);
    }
    for (const n of BOOK_STORES) for (const r of lacking[n]) {
      if (n === 'budgets') t.objectStore(n).put({ ...r, key: `${book.id}|${r.key}`, bookId: book.id });
      else t.objectStore(n).put({ ...r, bookId: book.id });
    }
    if (main && !main.currentBook) t.objectStore('settings').put({ ...main, currentBook: book.id }, 'main');
  });
}
// 백업 파일의 옛 형식 → 지금 형식 (가져오기 전에, 메모리에서만)
function migrateSnapshot(snap) {
  if ((snap.dataVersion || 1) >= 2) return snap;
  const st = { ...snap.stores };
  const main = Object.fromEntries(st.settings || []).main || {};
  const book = newBook('내 가계부', '📒', main.monthStart || 1, 0, { monthStartSet: !!main.monthStartSet });
  st.books = [[book.id, book]];
  for (const n of ['categories', 'methods', 'tx', 'recurring', 'goals']) st[n] = (st[n] || []).map(([k, r]) => [k, r.bookId ? r : { ...r, bookId: book.id }]);
  st.budgets = (st.budgets || []).map(([k, r]) => (r.bookId ? [k, r] : [`${book.id}|${r.key}`, { ...r, key: `${book.id}|${r.key}`, bookId: book.id }]));
  st.settings = (st.settings || []).map(([k, v]) => (k === 'main' ? [k, { ...v, currentBook: book.id }] : [k, v]));
  if (!st.settings.some(([k]) => k === 'main')) st.settings.push(['main', { currentBook: book.id }]);
  return { ...snap, dataVersion: 2, stores: st };
}

const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.name).localeCompare(String(b.name), 'ko');

/* ───────────── 4. 화면 틀 — 주소 · 시트 · 알림 ───────────── */
const VIEWS = {};
let curRoute = null, prevRoute = null, renderSeq = 0;
const scrollMem = {};   // 입력 화면에서 돌아올 때 목록 위치를 되살린다
const hashParams = () => new URLSearchParams(location.hash.split('?')[1] || '');
const routeNow = () => location.hash.replace(/^#\/?/, '').split('?')[0] || 'home';

async function render(keepScroll = false) {
  const route = routeNow();
  const fn = VIEWS[route] || VIEWS.home;
  const seq = ++renderSeq;
  let node;
  try { node = await fn(); } catch (e) { console.error(e); node = errorCard(e); }
  if (seq !== renderSeq) return;
  let restoreY = null;
  if (route !== curRoute) {
    if (curRoute) scrollMem[curRoute] = window.scrollY;
    if (curRoute === 'add' && scrollMem[route] != null) restoreY = scrollMem[route];
    prevRoute = curRoute; curRoute = route; keepScroll = false;
  }
  const y = window.scrollY;
  fillEl(view, node);
  window.scrollTo(0, restoreY != null ? restoreY : keepScroll ? y : 0);
  const tab = route.split('/')[0];
  $('#fab').hidden = !['home', 'list', 'stats', 'goal'].includes(route);
  for (const a of document.querySelectorAll('nav.tabs a')) {
    if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
}
const refresh = () => render(true);
window.addEventListener('hashchange', () => render());
// 하위 화면의 ‹ — 바로 앞이 부모 화면이면 뒤로 가기(기록이 쌓이지 않게), 아니면 부모로 바꾸기
function goUp(parent) { if (prevRoute === parent) history.back(); else location.replace('#/' + parent); }
function pageHead(title, parent, sub) {
  return h('div', {}, h('div', { class: 'period', style: 'margin:0 0 8px' },
    parent ? h('button', { class: 'icon-btn', 'aria-label': '뒤로', onclick: () => goUp(parent) }, h('span', { style: 'font-size:28px' }, '‹')) : null,
    h('h1', { style: 'flex:1;margin:4px 0' }, title)), sub ? h('p', { class: 'page-sub' }, sub) : null);

    const close = (v) => { if (!dlg._closing) { dlg._closing = true; value = v; history.back(); } return done; };
    dlg._finish = () => { try { dlg.close(); } catch {} dlg.remove(); if (openDlg === dlg) openDlg = null; resolve(value); doneResolve(); };
    dlg.addEventListener('cancel', (e) => { e.preventDefault(); close(undefined); });

}

function installmentParts(t) {
  const n = t.installment | 0;
  if (n < 2) return [{ date: t.date, amount: t.amount, k: 1, n: 1 }];
  const base = Math.floor(t.amount / n), first = t.amount - base * (n - 1);

}

async function monthEntries(p, bookId = BOOK.id) {
  const rows = await bookTx(bookId, addMonthsStr(p.start, -MAX_INSTALLMENT), p.end);
  const out = [];
  for (const t of rows) {
    if ((t.installment | 0) > 1) { for (const x of installmentParts(t)) if (x.date >= p.start && x.date <= p.end) out.push({ t, ...x }); }
    else if (t.date >= p.start) out.push({ t, date: t.date, amount: t.amount, k: 1, n: 1 });

}

async function storageInfo() {

  try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); out.usage = e.usage; out.quota = e.quota; } } catch {}
  return out;
}
async function requestPersist() {

}
const localDay = (iso) => { const t = new Date(iso); return ymd(t.getFullYear(), t.getMonth() + 1, t.getDate()); };
function sinceText(iso) {

}

/* ───────────── 8. 백업 (설계서 「5」) ───────────── */
async function snapshot(reason) {
  const stores = {};
  for (const s of DATA_STORES) stores[s] = await db.entries(s);
  return { app: 'ledger', format: 1, dataVersion: DATA_VERSION, appVersion: VERSION, date: new Date().toISOString(), reason, stores };
}
function snapStats(snap) {
  const tx = (snap.stores.tx || []).map(([, v]) => v).filter(Boolean);
  const dates = tx.map((t) => t.date).filter(Boolean).sort();
  const books = (snap.stores.books || []).map(([, v]) => v).filter(Boolean);
  return { tx: tx.length, first: dates[0], last: dates[dates.length - 1], books: books.length || 1, bookNames: books.sort(byOrder).map((b) => b.name) };
}
const statText = (st) => `가계부 ${st.books}개${st.bookNames.length ? ` (${st.bookNames.join(' · ')})` : ''} · 내역 ${num(st.tx)}건${st.first ? ` (${st.first} ~ ${st.last})` : ''}`;
function stamp() { const n = new Date(); return `${n.getFullYear()}${pad(n.getMonth() + 1)}${pad(n.getDate())}-${pad(n.getHours())}${pad(n.getMinutes())}`; }
// 파일 이름은 영어로 — 크롬이 blob 다운로드의 한글 이름을 버리고 «download» 로 저장하는 경우가 있다 (2026-11-07 시험에서 확인)
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name, style: 'display:none' });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
async function saveBackupFile(reason = '백업 파일') {
  const snap = await snapshot(reason);
  downloadBlob(new Blob([JSON.stringify(snap)], { type: 'application/json' }), `ledger-backup-${stamp()}.json`);
  await meta.set('lastBackupAt', snap.date);
  toast('✔ «다운로드» 폴더에 백업 파일을 저장했어요');
  refresh();
}
// 공유: 크롬은 공유할 수 있는 파일 종류가 정해져 있어 .json 이 안 되면 같은 내용을 .txt 로 보낸다
async function shareBackup() {
  const snap = await snapshot('공유');
  const text = JSON.stringify(snap);
  const can = (f) => { try { return !!(navigator.canShare && navigator.canShare({ files: [f] })); } catch { return false; } };
  let file = new File([text], `ledger-backup-${stamp()}.json`, { type: 'application/json' });
  if (!can(file)) file = new File([text], `ledger-backup-${stamp()}.txt`, { type: 'text/plain' });
  if (!can(file)) { toast('이 브라우저는 파일 공유를 못 해요. [백업 파일 저장] 을 쓰세요.', { ms: 5000 }); return; }
  try {
    await navigator.share({ files: [file], title: '가계부 백업' });
    await meta.set('lastBackupAt', snap.date);
    toast('✔ 백업 파일을 보냈어요'); refresh();
  } catch (e) { if (e && e.name !== 'AbortError') toast('공유하지 못했어요: ' + e.message, { ms: 5000 }); }
}
async function autoBackup(reason) {
  const snap = await snapshot(reason);
  const key = `${snap.date}|${reason}`;
  await db.put('backups', snap, key);
  const keys = (await db.entries('backups')).map(([k]) => k).sort();
  for (const k of keys.slice(0, Math.max(0, keys.length - 3))) await db.del('backups', k);
  return key;
}
function checkSnapshot(snap) {
  if (!snap || snap.app !== 'ledger' || !snap.stores || typeof snap.stores !== 'object') throw new Error('가계부 백업 파일이 아니에요.');
  for (const s of Object.values(snap.stores)) if (!Array.isArray(s)) throw new Error('백업 파일이 망가졌어요.');
  if ((snap.dataVersion || 1) > DATA_VERSION) throw new Error(`더 새 판(${snap.appVersion})에서 만든 백업이에요. 먼저 [⬆ 업그레이드] 를 하세요.`);
}
// 지금 데이터를 백업 내용으로 통째로 바꾼다 — 한 거래로 묶어 «반쯤 바뀐» 상태가 생기지 않게
async function restoreSnapshot(snap) {
  const data = migrateSnapshot(snap);
  if (!(data.stores.books || []).length) throw new Error('백업 파일에 가계부가 없어요.');

  const ok = await sheet('복구 코드 — 꼭 적어 두세요', (close) => {
    const chk = h('input', { type: 'checkbox' });
    const go = h('button', { class: 'btn primary', disabled: true, onclick: () => close(true) }, '적어 두었어요 — 잠금 켜기');
    chk.addEventListener('change', () => { go.disabled = !chk.checked; });
    return h('div', {}, h('p', {}, 'PIN 을 잊었을 때 이 코드로 잠금을 풀어요. ', h('b', {}, '지금 한 번만'), ' 보여 드려요.'),
      h('div', { class: 'rc-code', id: 'rc-code' }, code),
      h('p', { class: 'small muted' }, '종이 · 다른 기기의 메모 등 이 휴대폰 밖에 적어 두세요. 이 휴대폰에는 코드를 바꾼 값만 저장해요.'),
      h('label', { class: 'check' }, chk, '적어 두었어요'), h('div', { class: 'btns' }, go));
  });
  if (!ok) return false;
  const [pinRec, rcRec] = await Promise.all([makeSecret(pin), makeSecret(normRC(code))]);
  await saveLock({ pin: pinRec, pinLen: pin.length, rc: rcRec });
  return true;
}

/* ───────────── 9. ⬆ 업그레이드 — 내가 누를 때만 (설계서 「6-5」, daily-talk 과 같은 구조) ───────────── */
const SCOPE_URL = new URL('./', location.href).href;
const META_CACHE = 'lg-meta';
const STATE_URL = SCOPE_URL + '__lg/state';
const appCache = (v) => 'lg-app-' + v;
const upSupported = () => 'serviceWorker' in navigator && 'caches' in window && !!(window.crypto && crypto.subtle);
async function getUpState() {
  if (!('caches' in window)) return { current: null, previous: null, pending: null };
  const r = await (await caches.open(META_CACHE)).match(STATE_URL);
  return r ? r.json() : { current: null, previous: null, pending: null };
}
async function setUpState(st) {
  await (await caches.open(META_CACHE)).put(STATE_URL, new Response(JSON.stringify(st), { headers: { 'content-type': 'application/json' } }));
}
function cmpVer(a, b) {
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0);
  return 0;
}
async function fetchLatest() {
  const r = await fetch(`${SCOPE_URL}update/latest.json?lg-dl=${Date.now()}`, { cache: 'no-store' });
  if (r.status === 401) throw new Error('점검 사이트 로그인이 풀렸어요. 화면 위 [로그인] 을 눌러 다시 로그인하세요.');
  if (!r.ok) throw new Error(`새 판 정보를 읽지 못했어요 (${r.status})`);
  return r.json();
}
function diffFiles(st, latest) {
  const cur = (st.current && st.current.files) || {};
  const changed = latest.files.filter((f) => cur[f.path] !== f.sha256);
  return { changed, bytes: changed.reduce((s, f) => s + f.size, 0) };
}
async function checkUpdate() {
  const st = await getUpState();
  const latest = await fetchLatest();
  await meta.set('lastUpdateCheck', Date.now());
  const newer = !st.current || cmpVer(latest.version, st.current.version) > 0;
  const already = !!(st.pending && st.pending.version === latest.version);
  await meta.set('updateAvailable', newer && !already ? latest.version : false);
  return { st, latest, newer, already, ...diffFiles(st, latest) };
}
async function autoCheckUpdate() {
  if (!upSupported() || (await meta.get('autoCheck')) === false) return false;
  if (!(await getUpState()).current) return false;
  const last = (await meta.get('lastUpdateCheck')) || 0;
  if (Date.now() - last < 20 * 3600 * 1000) return (await meta.get('updateAvailable')) || false;
  try { const r = await checkUpdate(); return r.newer && !r.already ? r.latest.version : false; } catch { return false; }
}
async function sha256(buf) {
  const d = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
const MIME = { html: 'text/html', js: 'text/javascript', css: 'text/css', json: 'application/json', webmanifest: 'application/manifest+json', png: 'image/png', svg: 'image/svg+xml' };
const mimeOf = (p) => MIME[p.split('.').pop()] || 'application/octet-stream';
// ⬆ 받기 — 바뀐 파일만 받고, 파일마다 sha256 을 확인한다. 하나라도 틀리면 멈추고 지금 판을 그대로 둔다
async function downloadUpdate(latest, onProgress) {
  const st = await getUpState();
  await autoBackup(`업그레이드 전 (${(st.current && st.current.version) || VERSION} → ${latest.version})`);
  const name = appCache(latest.version);
  await caches.delete(name);
  const next = await caches.open(name);
  const cur = st.current ? await caches.open(appCache(st.current.version)) : null;
  const curFiles = (st.current && st.current.files) || {};
  try {
    let done = 0;
    for (const f of latest.files) {
      const url = SCOPE_URL + f.path;
      const same = cur && curFiles[f.path] === f.sha256 ? await cur.match(url) : null;
      let resp = same ? new Response(await same.arrayBuffer(), { headers: { 'content-type': mimeOf(f.path) } }) : null;
      if (!resp) {
        const r = await fetch(`${url}?lg-dl=${f.sha256.slice(0, 12)}`, { cache: 'no-store' });
        if (!r.ok) throw new Error(`${f.path} 를 받지 못했어요 (${r.status})`);
        const buf = await r.arrayBuffer();
        if ((await sha256(buf)) !== f.sha256) throw new Error(`${f.path} 확인에 실패했어요. 받다가 끊겼을 수 있어요.`);
        resp = new Response(buf, { headers: { 'content-type': mimeOf(f.path) } });
      }
      await next.put(url, resp);
      onProgress(++done, latest.files.length);
    }
  } catch (e) { await caches.delete(name); throw e; }
  st.pending = { version: latest.version, date: latest.date, notes: latest.notes || [], dataVersion: latest.dataVersion,
    files: Object.fromEntries(latest.files.map((f) => [f.path, f.sha256])) };
  await setUpState(st);
  await meta.set('updateAvailable', false);
}
async function keepOnly(st) {
  const keep = new Set([st.current, st.previous, st.pending].filter(Boolean).map((v) => appCache(v.version)));
  for (const k of await caches.keys()) if (k.startsWith('lg-app-') && !keep.has(k)) await caches.delete(k);
}
async function activateUpdate() {
  const st = await getUpState();
  if (!st.pending) return;
  st.previous = st.current; st.current = st.pending; st.pending = null;
  await setUpState(st); await keepOnly(st);
  await meta.set('justUpgraded', { from: st.previous && st.previous.version, to: st.current.version, notes: st.current.notes });
  location.reload();
}
async function rollbackUpdate() {
  const st = await getUpState();
  if (!st.previous) return;
  [st.current, st.previous] = [st.previous, st.current];
  st.pending = null;
  await setUpState(st); await keepOnly(st);
  await meta.set('justUpgraded', { from: st.previous.version, to: st.current.version, rollback: true });
  location.reload();
}

async function upgradeCard() {
  const box = h('section', { class: 'card', id: 'upgrade' }, h('h2', {}, '⬆ 업그레이드'));
  if (!upSupported()) { box.append(h('p', { class: 'muted' }, '이 브라우저에서는 프로그램 안 업그레이드를 쓸 수 없어요.')); return box; }
  const st = await getUpState();
  box.append(h('p', {}, '지금 판 ', h('b', {}, (st.current && st.current.version) || VERSION),
    st.current ? h('span', { class: 'muted' }, ` (${st.current.date})`) : h('span', { class: 'small muted' }, ' — 휴대폰에 저장하는 중이에요. 잠시 뒤 다시 열어 보세요.')));
  const out = h('div', { 'aria-live': 'polite' });
  const restartBlock = (p) => h('div', {},
    h('p', {}, '✔ 새 판 ', h('b', {}, p.version), ' 을 받아 두었어요. 누르면 바뀌어요.'),
    p.notes && p.notes.length ? h('ul', { class: 'up-notes small' }, p.notes.map((n) => h('li', {}, n))) : null,
    h('div', { class: 'btns' }, h('button', { class: 'btn primary', onclick: activateUpdate }, '🔄 새 판으로 다시 시작')));
  if (st.pending) out.append(restartBlock(st.pending));
  const checkBtn = h('button', { class: 'btn block', onclick: async () => {
    checkBtn.disabled = true; fillEl(out, h('p', { class: 'muted' }, '확인 중…'));
    try {
      const r = await checkUpdate();
      document.getElementById('gear-dot').hidden = true;
      if (r.already) { fillEl(out, restartBlock(r.st.pending)); return; }
      if (!r.newer) { fillEl(out, h('p', {}, `✔ 지금이 최신 판이에요 (${r.latest.version}).`)); return; }
      const bar = h('div', { class: 'progress', hidden: true }, h('i'));
      const getBtn = h('button', { class: 'btn primary block', onclick: async () => {
        const choice = await sheet('받기 전에 백업', (close) => h('div', {},
          h('p', {}, '받기 전에 지금 데이터를 휴대폰 안에 자동 백업해요. 백업 파일로도 저장할까요?'),
          h('div', { class: 'btns' },
            h('button', { class: 'btn primary', onclick: () => close('file') }, '💾 백업 파일도 저장하고 받기'),
            h('button', { class: 'btn', onclick: () => close('go') }, '그냥 받기'),
            h('button', { class: 'btn', onclick: () => close() }, '취소'))));
        if (!choice) return;
        if (choice === 'file') await saveBackupFile(`업그레이드 전 (${r.latest.version})`);
        getBtn.disabled = true; bar.hidden = false;
        try {
          await downloadUpdate(r.latest, (d, n) => { bar.firstChild.style.width = `${Math.round((d / n) * 100)}%`; getBtn.textContent = `받는 중… ${d}/${n}`; });
          fillEl(out, restartBlock((await getUpState()).pending));
        } catch (e) { getBtn.disabled = false; getBtn.textContent = '⬆ 다시 받기'; bar.hidden = true; toast(e.message, { ms: 6000 }); }
      } }, '⬆ 지금 받기');
      fillEl(out, h('p', {}, '새 판 ', h('b', {}, r.latest.version), ` (${r.latest.date}) · 받을 크기 약 ${kb(r.bytes)}`),
        r.latest.notes && r.latest.notes.length ? h('ul', { class: 'up-notes small' }, r.latest.notes.map((n) => h('li', {}, n))) : null, bar, getBtn);
    } catch (e) { fillEl(out, h('p', { class: 'err' }, e.message)); } finally { checkBtn.disabled = false; }
  } }, '🔎 새 판이 있는지 확인');
  const auto = h('input', { type: 'checkbox', checked: (await meta.get('autoCheck')) !== false });
  auto.addEventListener('change', () => meta.set('autoCheck', auto.checked));
  // DOM 의 append 는 null 을 «null» 글자로 넣으므로 h() 로 감싸 거른다
  box.append(h('div', {}, h('div', { class: 'btns' }, checkBtn), out,
    st.previous ? h('div', { class: 'btns' }, h('button', { class: 'btn', onclick: async () => {
      if (await ask('이전 판으로 되돌리기', [`판 ${st.previous.version} 으로 되돌릴까요? 기록은 그대로 남아요.`], { ok: '되돌리기' })) rollbackUpdate();
    } }, `↩ 이전 판(${st.previous.version})으로 되돌리기`)) : null,
    h('label', { class: 'check small' }, auto, '하루 한 번 새 판 자동 확인 (확인만 하고 받지는 않아요)'),
    h('p', { class: 'small muted' }, '새 판은 내가 누를 때만 바뀌어요. 받기 전에 자동 백업하고, 이전 판 하나를 보관해서 되돌릴 수 있어요.')));
  return box;
}

/* ───────────── 10. 위쪽 띠 — 개발 판 · 점검 사이트 로그인 ───────────── */
function addBar(cls, id, ...kids) {
  if (document.getElementById(id)) return;
  $('#bars').append(h('div', { class: 'bar ' + cls, id, role: cls === 'warn' ? 'alert' : null }, ...kids));
}
// 정식 주소가 아닌 곳(점검 주소 · 시험)에서는 판과 상관없이 띠를 보여 준다 — 진짜 기록을 거기 넣지 않게
const OFFICIAL_HOST = 'dadaschool.github.io';
function devBar() {
  const staging = location.hostname !== OFFICIAL_HOST;
  if ((!VERSION.startsWith('0.') && !staging) || sessionStorage.getItem('lg-dev-bar') === 'off') return;
  addBar('dev', 'dev-bar', VERSION.startsWith('0.')
    ? h('span', {}, `개발 중인 판(${VERSION})이에요. `, h('b', {}, '시험 데이터만'), ' 넣어 주세요.')
    : h('span', {}, '점검용 주소예요. ', h('b', {}, '진짜 기록은 정식 주소'), `(${OFFICIAL_HOST}/ledger/)에 넣어 주세요 — 주소가 다르면 데이터도 따로예요.`),
    h('button', { class: 'btn small', onclick: (e) => { try { sessionStorage.setItem('lg-dev-bar', 'off'); } catch {} e.currentTarget.parentElement.remove(); } }, '닫기'));
}
// 점검 사이트(geoje — 비밀번호 문)에서만 생기는 일: 크롬을 다시 켜면 브라우저가 로그인을 잊는다.
// 화면은 캐시로 열리지만 새 판은 401 로 못 받으므로 [로그인] 을 보여 준다. 끝 빗금 없는 주소는 서비스 워커 범위 밖이라 로그인 창이 뜬다.
async function checkLogin() {
  let r;
  try { r = await fetch(`${SCOPE_URL}update/latest.json?lg-dl=login-check`, { method: 'HEAD', cache: 'no-store' }); } catch { return; }
  if (r.status !== 401) return;
  addBar('warn', 'login-bar', h('span', {}, '점검 사이트 로그인이 풀렸어요. 새 판을 받으려면 다시 로그인하세요.'),
    h('a', { class: 'btn small', href: `${location.pathname.replace(/\/+$/, '').replace(/\/index\.html$/, '')}?login` }, '로그인'));
}
let afterUnlock = null;   // 잠겨 있으면 «새 판으로 바뀌었어요» 창은 연 뒤에 (창이 잠금 화면 위로 뜨지 않게)
async function showJustUpgraded() {
  if (locked) { afterUnlock = showJustUpgraded; return; }
  const j = await meta.get('justUpgraded');
  if (!j) return;
  await meta.del('justUpgraded');
  await ask(j.rollback ? '이전 판으로 되돌렸어요' : '새 판으로 바뀌었어요', [
    h('p', {}, j.rollback ? `판 ${j.from} → ${j.to}` : `판 ${j.from || '?'} → `, j.rollback ? null : h('b', {}, j.to)),
    !j.rollback && j.notes && j.notes.length ? h('ul', { class: 'up-notes' }, j.notes.map((n) => h('li', {}, n))) : h('p', { class: 'muted small' }, '기록은 그대로예요.'),
  ], { ok: '확인', cancel: '닫기' });
}

/* ───────────── 11. 시작 ───────────── */
(async function start() {
  if (new URLSearchParams(location.search).has('login')) history.replaceState(null, '', location.pathname + location.hash);
  $('#book-btn').addEventListener('click', pickBook);
  try {
    await openDB(); await seedIfEmpty(); await migrate(); await loadSettings(); await loadBook(); await loadLock();
  } catch (e) {
    fillEl(view, h('div', { class: 'card' }, h('p', { class: 'err' }, '⚠ 휴대폰 저장 공간을 열 수 없어요.'),
      h('p', { class: 'small' }, '크롬의 시크릿 모드이거나 저장 공간이 꽉 찼을 수 있어요.'), h('p', { class: 'small muted' }, String(e && e.message || e))));
    return;
  }
  if (!location.hash) history.replaceState(null, '', location.pathname + location.search + '#/home');
  if (LOCK.kind !== 'none') showLock();          // 내용이 보이기 전에 잠근다
  devBar();
  await render();
  showJustUpgraded();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' }).catch((e) => console.warn('서비스 워커 등록 실패', e));
  }
  storageInfo().then((i) => { if (i.persisted === false) requestPersist(); });
  checkLogin();
  autoCheckUpdate().then((v) => { if (v) $('#gear-dot').hidden = false; });
})();
