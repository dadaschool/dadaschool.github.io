<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>컴퓨터 동아리 파이썬</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/clike/clike.min.js"></script>
<script src="config.js"></script>
<script src="runner.js"></script>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --ink:#1b2130; --muted:#5b6476; --line:#dde1e8;
  --brand:#0f766e; --brand-ink:#fff; --brand-soft:#dff3f0;
  --ok:#14804a; --ok-soft:#e3f5ea; --bad:#c4321f; --bad-soft:#fdecea; --warn:#9a5800; --warn-soft:#fff4df;
  --try:#b7791f; --code-bg:#f6f7f9;
  --mono:"JetBrains Mono","Pretendard",monospace;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard",system-ui,sans-serif;font-size:15px;line-height:1.55;word-break:keep-all}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hidden,[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#b9c1cf}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.small{padding:4px 10px;font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.pill.gray{background:#eef0f4;color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}

/* 로그인 */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:440px;box-shadow:0 6px 24px rgba(20,30,60,.06)}
.card h1{margin:0 0 4px;font-size:24px}
.card .sub{color:var(--muted);margin:0 0 20px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.msg{border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.engine{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:#c3c9d4;flex:none}
.dot.loading{background:#f0a400;animation:blink 1s infinite}
.dot.ready{background:var(--ok)}
.dot.error{background:var(--bad)}
@keyframes blink{50%{opacity:.3}}

/* 앱 */
#app{display:flex;flex-direction:column;height:100%}
header.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header.top h1{font-size:17px;margin:0;margin-right:auto;display:flex;align-items:center;gap:8px}
.who{color:var(--muted);font-size:14px}
.solvedNum{font-weight:800;color:var(--ok)}
.layout{display:grid;grid-template-columns:300px 1fr;min-height:0;flex:1}
nav.side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:0;background:#fff;padding:6px 8px;cursor:pointer;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;cursor:pointer;font-size:13px;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;margin:6px 0 10px}
.filters select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fff}
.bar{height:7px;background:#eef0f4;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.summary{font-size:13px;color:var(--muted);margin:2px 0 8px}
.lvl{margin:12px 0 4px;font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
.plist{list-style:none;margin:0;padding:0}
.plist button{width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;display:flex;gap:8px;align-items:center}
.plist button:hover{background:#f1f3f7}
.plist button[aria-current="true"]{background:var(--brand-soft);color:#0b4f4a;font-weight:700}
.plist .st{width:18px;text-align:center;flex:none}
.plist .t{flex:1;min-width:0}
.plist .n{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.empty{color:var(--muted);font-size:14px;padding:8px}

main.work{display:grid;grid-template-columns:minmax(300px,2fr) 3fr;min-height:0}
main.work.paper{grid-template-columns:1fr}
.pane{overflow:auto;padding:18px 20px;min-width:0}
.problem{border-right:1px solid var(--line);background:var(--panel)}
main.work.paper .problem{border-right:0;max-width:880px;width:100%;margin:0 auto}
.problem h2{margin:6px 0 10px;font-size:20px}
.problem .meta{display:flex;gap:6px;flex-wrap:wrap}
.problem h3{font-size:14px;margin:18px 0 6px;color:var(--muted)}
.problem .body{white-space:pre-wrap}
.ex{border:1px solid var(--line);border-radius:8px;margin:8px 0;overflow:hidden}
.ex .row{display:grid;grid-template-columns:1fr 1fr}
.ex .row>div{padding:8px 10px;min-width:0}
.ex .row>div+div{border-left:1px solid var(--line)}
.ex b{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
pre.io{margin:0;font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto}
.codeShow{border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden}
.codeShow .lang{background:#eef0f4;font-size:12px;font-weight:700;padding:4px 10px;color:var(--muted)}
.codeShow .CodeMirror{min-height:0;height:auto;border:0;border-radius:0;font-size:14px}
.codeShow .CodeMirror-scroll{min-height:0;max-height:none}
.choices{display:grid;gap:8px;margin:14px 0}
.choices label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;background:#fff}
.choices label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.choices input{margin-top:4px}
.shortAns{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.shortAns input{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-family:var(--mono)}
.scaleBox{border:1px solid #c9e6e2;background:#f1faf8;border-radius:10px;padding:10px 12px;margin-top:16px;font-size:14px}
.scaleBox b.h{display:block;color:#0b4f4a;margin-bottom:4px}
.scaleBox table{border-collapse:collapse;margin-top:6px;width:100%}
.scaleBox td{padding:3px 6px;border-top:1px solid #d6ece8;vertical-align:top}
.scaleBox td.v{text-align:right;font-family:var(--mono);white-space:nowrap}
.scaleBox .over{color:var(--bad);font-weight:700}
.scaleBox .fit{color:var(--ok);font-weight:700}
.scaleBox .note{font-size:12.5px;color:var(--muted);margin-top:6px}
.hintBox{margin-top:14px}
.hintBox .hint{background:#fff8e1;border:1px solid #f3dcae;border-radius:8px;padding:10px 12px;margin:8px 0;white-space:pre-wrap}
.hintBox .hint b{color:var(--warn);display:block;font-size:12px;margin-bottom:2px}
.tip{font-size:13px;color:var(--muted);background:#f6f7f9;border-radius:8px;padding:8px 10px;margin-top:16px}

.editorPane{display:flex;flex-direction:column;gap:10px}
#editorHost .CodeMirror{height:auto;min-height:280px;border:1px solid var(--line);border-radius:var(--radius);font-family:var(--mono);font-size:15px;line-height:1.5}
#editorHost .CodeMirror-scroll{min-height:280px;max-height:56vh}
#editorHost .CodeMirror-focused{outline:3px solid var(--brand);outline-offset:1px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .spacer{flex:1}
.stdinBox textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:14px;resize:vertical;background:#fff}
.stdinBox label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
.result{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;min-height:80px}
.result h4{margin:0 0 8px;font-size:15px}
.result .score{font-size:20px;font-weight:800}
.result .score.ok{color:var(--ok)}
.result .score.bad{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border-radius:6px;padding:3px 9px;font-size:13px;font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip small{font-weight:500;opacity:.75;font-family:var(--mono)}
.errbox{background:var(--bad-soft);color:#7d1e12;border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14px}
.errbox .raw{font-family:var(--mono);font-size:12.5px;opacity:.8;margin-top:4px;white-space:pre-wrap}
.cmp{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.cmp th,.cmp td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.cmp th{background:#f6f7f9;font-weight:700;color:var(--muted)}
.nextRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222a38;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;max-width:90vw}
dialog{border:1px solid var(--line);border-radius:14px;padding:22px;max-width:520px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(15,20,35,.45)}
dialog h3{margin:0 0 8px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.stat{background:#f6f7f9;border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.prow{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.prow .v{text-align:right;font-family:var(--mono);color:var(--muted)}

@media (max-width:1000px){
  main.work{grid-template-columns:1fr}
  .problem{border-right:0;border-bottom:1px solid var(--line)}
}
@media (max-width:720px){
  .layout{grid-template-columns:1fr}
  nav.side{border-right:0;border-bottom:1px solid var(--line);max-height:42vh}
  .pane{padding:14px 16px}
  header.top{flex-wrap:wrap}
  .stats{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>
<body>

<!-- ============ 로그인 ============ -->
<section id="login">
  <div class="card">
    <h1>🧩 컴퓨터 동아리 파이썬</h1>
    <p class="sub">자료구조 · 알고리즘 · 정올대비 · 1교시준비 — 정보올림피아드 대비</p>
    <form id="pinForm" autocomplete="off">
      <label class="field"><span>학번</span><input id="loginNo" inputmode="numeric" required placeholder="예: 20305"></label>
      <label class="field"><span>PIN (파이썬 코딩 연습장과 같은 숫자)</span><input id="loginPin" type="password" inputmode="numeric" required></label>
      <button class="btn primary" style="width:100%;justify-content:center" type="submit">로그인</button>
    </form>
    <div id="loginMsg"></div>
    <div class="engine" aria-live="polite">
      <span class="dot" id="engineDot"></span>
      <span id="engineText">파이썬 실행기를 준비하지 않았습니다.</span>
      <button class="btn small" id="engineBtn" type="button" style="margin-left:auto">미리 준비</button>
    </div>
  </div>
</section>

<!-- ============ 앱 ============ -->
<section id="app" class="hidden">
  <header class="top">
    <h1>🧩 컴퓨터 동아리 파이썬</h1>
    <span class="dot" id="engineDot2" title="파이썬 실행기 상태"></span>
    <span class="who" id="who"></span>
    <button class="btn small" id="statsBtn" type="button">📈 내 기록 · <span class="solvedNum" id="solvedNum">0</span>문제</button>
    <button class="btn small ghost" id="logoutBtn" type="button">나가기</button>
  </header>
  <div class="layout">
    <nav class="side" aria-label="문제 고르기">
      <div class="seg" id="bankSeg" role="group" aria-label="문제 묶음"></div>
      <div class="tabs" id="topicTabs" role="group" aria-label="주제"></div>
      <div class="filters">
        <label>단계 <select id="levelSel" aria-label="단계"></select></label>
        <label><input type="checkbox" id="unsolvedOnly"> 안 푼 것만</label>
      </div>
      <button class="btn primary small" id="randomBtn" type="button" style="width:100%;justify-content:center">🎲 무작위로 한 문제 (안 푼 문제 먼저)</button>
      <div id="plistArea" style="margin-top:8px"></div>
    </nav>
    <main class="work" id="work">
      <article class="pane problem" id="problemPane" aria-live="polite">
        <p class="empty">왼쪽에서 문제를 고르거나 «🎲 무작위» 를 누르세요.</p>
      </article>
      <section class="pane editorPane" id="editorPane" aria-label="코드 작성">
        <div id="editorHost"></div>
        <div class="stdinBox" id="stdinBox">
          <label for="stdin">입력 칸 — «실행» 할 때 input() · sys.stdin 이 여기서 읽습니다</label>
          <textarea id="stdin" spellcheck="false"></textarea>
        </div>
        <div class="toolbar">
          <button class="btn" id="runBtn" type="button" title="Ctrl+Enter">▶ 실행</button>
          <button class="btn primary" id="gradeBtn" type="button" title="Ctrl+Shift+Enter">✓ 채점하기</button>
          <span class="spacer"></span>
          <button class="btn small ghost" id="resetBtn" type="button">처음 코드로</button>
        </div>
        <div class="result" id="result" aria-live="polite">
          <p class="empty" style="padding:0">«실행» 으로 결과를 보고, «채점하기» 로 맞았는지 확인하세요.</p>
        </div>
      </section>
    </main>
  </div>
</section>

<dialog id="confirmDlg">
  <h3 id="confirmTitle"></h3>
  <div id="confirmBody"></div>
  <div class="actions">
    <button class="btn" id="confirmNo" type="button">취소</button>
    <button class="btn primary" id="confirmYes" type="button">확인</button>
  </div>
</dialog>

<dialog id="statsDlg" aria-labelledby="statsTitle">
  <h3 id="statsTitle">📈 내 기록</h3>
  <div id="statsBody"></div>
  <div class="actions"><button class="btn primary" type="button" onclick="this.closest('dialog').close()">닫기</button></div>
</dialog>

<script>
/* =========================================================
   동아리 학생 화면
   · 로그인 필수 (학번 + pycoding PIN, 동아리 명단에 있어야 함)
   · 연습: 묶음(동아리·pycoding) → 주제 → 단계. 직접 고르기 / 무작위(안 푼 문제 먼저) / 통과하면 «다음 문제»
   · 코드 채점은 이 브라우저(Pyodide)에서, 1교시(객관식·단답)는 서버가 채점
   ========================================================= */
"use strict";
const CFG = window.PYCLUB_CONFIG || {};
const API = (CFG.API_BASE || "").replace(/\/+$/, "");
const PC = window.PyClub;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

const S = {
  token: null, student: null,
  list: [], prog: {}, cache: {},
  bank: store.get("pcl:bank") || "pyclub", topic: null, level: "all", unsolvedOnly: false,
  current: null, cm: null, busy: false, revealed: {},
};

/* ---------- 파이썬 실행기 ---------- */
const runner = new PC.Runner((st, err) => {
  const text = { loading: "파이썬 실행기를 불러오는 중… (처음 한 번 약 10MB)", ready: "파이썬 준비 완료", error: "불러오기 실패: " + (err || "") }[st];
  for (const id of ["engineDot", "engineDot2"]) $(id).className = "dot " + st;
  $("engineText").textContent = text;
  $("engineDot2").title = text;
  $("engineBtn").hidden = st === "ready" || st === "loading";
  if (st === "error") $("engineBtn").textContent = "다시 시도";
});
$("engineBtn").onclick = () => runner.ready().catch((e) => toast(e.message));

/* ---------- 서버 ---------- */
async function api(path, opt = {}) {
  const res = await fetch(API + path, {
    method: opt.method || "GET",
    headers: Object.assign({ "Content-Type": "application/json" }, S.token ? { Authorization: "Bearer " + S.token } : {}),
    body: opt.body ? JSON.stringify(opt.body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401 && S.token && !opt.noLogout) { logout(true); throw new Error(data.error || "다시 로그인하세요."); }
  if (!res.ok) throw new Error(data.error || "서버 오류 (" + res.status + ")");
  return data;
}

/* ---------- 로그인 ---------- */
function showLoginMsg(text, kind = "err") { $("loginMsg").innerHTML = text ? `<div class="msg ${kind}">${esc(text)}</div>` : ""; }

async function initLogin() {
  if (!API) { showLoginMsg("채점 서버 주소(config.js)가 비어 있습니다. 선생님께 알려 주세요.", "warn"); return; }
  const saved = store.get("pcl:token");
  if (saved) {
    S.token = saved;
    try { const me = await api("/api/me", { noLogout: true }); return enter(me.student); }
    catch { S.token = null; store.del("pcl:token"); }
  }
}

$("pinForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  showLoginMsg("");
  try {
    const d = await api("/api/login/pin", { method: "POST", body: { studentNo: $("loginNo").value.trim(), pin: $("loginPin").value.trim() } });
    S.token = d.token;
    store.set("pcl:token", d.token);
    $("loginPin").value = "";
    enter(d.student);
  } catch (err) { showLoginMsg(err.message); }
});

function logout(expired) {
  if (S.token && !expired) api("/api/logout", { method: "POST" }).catch(() => {});
  store.del("pcl:token");
  location.reload();
}
$("logoutBtn").onclick = () => logout(false);

async function enter(student) {
  S.student = student;
  $("who").textContent = `${student.studentNo} ${student.name}${student.groupName ? " · " + student.groupName : ""}`;
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  runner.ready().catch((e) => toast(e.message));
  setupEditor();
  await loadList();
}

async function loadList() {
  try {
    const d = await api("/api/problems");
    S.list = d.problems;
    S.prog = {};
    for (const m of d.mine) S.prog[m.problem_id] = m;
  } catch (e) { toast("문제를 불러오지 못했습니다: " + e.message); S.list = []; }
  if (!banksPresent().includes(S.bank)) S.bank = banksPresent()[0] || "pyclub";
  if (!S.topic || PC.bankOf(S.topic) !== S.bank) S.topic = (store.get("pcl:topic:" + S.bank)) || PC.BANKS[S.bank].topics[0].key;
  renderSide();
  updateSolvedNum();
}

const isSolved = (id) => !!(S.prog[id] && S.prog[id].solved_at);
const isTried = (id) => !!S.prog[id] && !isSolved(id);
function banksPresent() { return ["pyclub", "pycoding"].filter((b) => S.list.some((p) => p.bank === b)); }

/* ---------- 왼쪽: 묶음 · 주제 · 단계 · 목록 ---------- */
function renderSide() {
  const banks = banksPresent();
  $("bankSeg").innerHTML = (banks.length ? banks : ["pyclub"]).map((b) =>
    `<button type="button" data-b="${b}" aria-pressed="${b === S.bank}">${b === "pyclub" ? "🧩 동아리 문제" : "🐍 pycoding 문제"}</button>`).join("");
  $("bankSeg").querySelectorAll("button").forEach((x) => x.onclick = () => {
    S.bank = x.dataset.b; store.set("pcl:bank", S.bank);
    S.topic = store.get("pcl:topic:" + S.bank) || PC.BANKS[S.bank].topics[0].key;
    S.level = "all"; renderSide();
  });
  const B = PC.BANKS[S.bank];
  $("topicTabs").innerHTML = B.topics.map((t) => {
    const all = S.list.filter((p) => p.topic === t.key);
    const done = all.filter((p) => isSolved(p.id)).length;
    return `<button type="button" data-t="${t.key}" aria-pressed="${t.key === S.topic}">${t.name} <small>${done}/${all.length}</small></button>`;
  }).join("");
  $("topicTabs").querySelectorAll("button").forEach((x) => x.onclick = () => {
    S.topic = x.dataset.t; store.set("pcl:topic:" + S.bank, S.topic); S.level = "all"; renderSide();
  });
  $("levelSel").innerHTML = `<option value="all">전체</option>` +
    Object.entries(B.levels).map(([k, v]) => `<option value="${k}">${k}단계 · ${v}</option>`).join("");
  $("levelSel").value = S.level;
  renderList();
}
$("levelSel").onchange = () => { S.level = $("levelSel").value; renderList(); };
$("unsolvedOnly").onchange = () => { S.unsolvedOnly = $("unsolvedOnly").checked; renderList(); };

function filtered() {
  return S.list.filter((p) => p.bank === S.bank && p.topic === S.topic &&
    (S.level === "all" || String(p.level) === String(S.level)));
}

function icon(p) { return isSolved(p.id) ? "✅" : isTried(p.id) ? "🟡" : "○"; }

function renderList() {
  const area = $("plistArea");
  const all = filtered();
  const done = all.filter((p) => isSolved(p.id)).length;
  const list = S.unsolvedOnly ? all.filter((p) => !isSolved(p.id)) : all;
  let html = `<div class="summary">푼 문제 ${done} / ${all.length}</div><div class="bar"><i style="width:${all.length ? (100 * done / all.length).toFixed(1) : 0}%"></i></div>`;
  if (!list.length) { area.innerHTML = html + `<p class="empty">${all.length ? "이 단계 문제를 모두 풀었습니다! 🎉" : "아직 문제가 없습니다."}</p>`; return; }
  const B = PC.BANKS[S.bank];
  for (const lv of Object.keys(B.levels)) {
    const ps = list.filter((p) => String(p.level) === lv);
    if (!ps.length) continue;
    const d = all.filter((p) => String(p.level) === lv && isSolved(p.id)).length;
    const n = all.filter((p) => String(p.level) === lv).length;
    html += `<div class="lvl"><span>${lv}단계 · ${B.levels[lv]}</span><span>${d}/${n}</span></div><ul class="plist">` + ps.map((p) =>
      `<li><button type="button" data-id="${esc(p.id)}" aria-current="${S.current && S.current.id === p.id}">
        <span class="st">${icon(p)}</span><span class="t">${esc(p.title)}</span><span class="n">${esc(p.id)}</span></button></li>`).join("") + `</ul>`;
  }
  area.innerHTML = html;
  area.querySelectorAll("button[data-id]").forEach((b) => b.onclick = () => openProblem(b.dataset.id));
}

function updateSolvedNum() {
  $("solvedNum").textContent = Object.values(S.prog).filter((m) => m.solved_at).length;
}

/* ---------- 무작위 · 다음 문제 ---------- */
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
$("randomBtn").onclick = () => {
  const all = filtered().filter((p) => !S.current || p.id !== S.current.id);
  if (!all.length) return toast("고를 문제가 없습니다.");
  const fresh = all.filter((p) => !isSolved(p.id) && !isTried(p.id));
  const tried = all.filter((p) => isTried(p.id));
  const p = pick(fresh.length ? fresh : tried.length ? tried : all);
  if (!fresh.length && !tried.length) toast("이 범위 문제를 모두 풀었습니다 — 푼 문제 중에서 골랐어요.");
  openProblem(p.id);
};

// 같은 주제·단계의 안 푼 문제 → 다음 단계 → 같은 주제 아무거나
function nextProblem() {
  const c = S.current;
  if (!c) return null;
  const same = S.list.filter((p) => p.bank === c.bank && p.topic === c.topic && p.id !== c.id && !isSolved(p.id));
  return pick(same.filter((p) => p.level === c.level)) || same.filter((p) => p.level > c.level).sort((a, b) => a.level - b.level)[0] || pick(same) || null;
}

/* ---------- 편집기 ---------- */
function setupEditor() {
  if (S.cm) return;
  S.cm = CodeMirror($("editorHost"), {
    mode: "python", lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false,
    smartIndent: true, viewportMargin: Infinity,
    extraKeys: {
      Tab: (cm) => cm.somethingSelected() ? cm.indentSelection("add") : cm.replaceSelection("    ", "end"),
      "Shift-Tab": (cm) => cm.indentSelection("subtract"),
      "Ctrl-Enter": () => doRun(), "Cmd-Enter": () => doRun(),
      "Shift-Ctrl-Enter": () => doGrade(), "Shift-Cmd-Enter": () => doGrade(),
      Esc: (cm) => cm.getInputField().blur(),
    },
  });
  S.cm.getInputField().setAttribute("aria-label", "파이썬 코드 편집기 (Esc 로 빠져나오기)");
  let t = null;
  S.cm.on("change", () => { clearTimeout(t); t = setTimeout(saveDraft, 400); });
}
function draftKey(p) { return `pcl:draft:${S.student ? S.student.studentNo : "x"}:${p.id}`; }
function saveDraft() { if (S.current && S.cm && !PC.isPaper(S.current)) store.set(draftKey(S.current), S.cm.getValue()); }

/* ---------- 문제 열기 ---------- */
async function openProblem(id) {
  saveDraft();
  let p = S.cache[id];
  if (!p) {
    $("problemPane").innerHTML = `<p class="empty">문제를 불러오는 중…</p>`;
    try { p = S.cache[id] = (await api("/api/problems/" + encodeURIComponent(id))).problem; }
    catch (e) { $("problemPane").innerHTML = `<div class="errbox">${esc(e.message)}</div>`; return; }
  }
  S.current = p;
  if (p.bank !== S.bank || p.topic !== S.topic) {
    S.bank = p.bank; S.topic = p.topic; renderSide();
  } else renderList();
  const paper = PC.isPaper(p);
  $("work").classList.toggle("paper", paper);
  $("editorPane").classList.toggle("hidden", paper);
  $("problemPane").innerHTML = paper ? paperHtml(p) : codeProblemHtml(p);
  $("problemPane").scrollTop = 0;
  if (p.code && p.code.text) showCode(p.code);
  renderHints(p);
  if (paper) return setupPaper(p);

  let code = store.get(draftKey(p));
  if (code == null) code = p.starter || "";
  S.cm.setValue(code);
  S.cm.clearHistory();
  const isFunc = p.type === "func";
  $("stdinBox").classList.toggle("hidden", isFunc);
  $("stdin").value = isFunc ? "" : ((p.examples && p.examples[0] && p.examples[0].input) || "");
  $("result").innerHTML = `<p class="empty" style="padding:0">«실행» 으로 결과를 보고, «채점하기» 로 맞았는지 확인하세요.</p>`;
  updateButtons();
  S.cm.refresh();
}

function metaHtml(p) {
  const B = PC.BANKS[p.bank] || PC.BANKS.pyclub;
  const st = isSolved(p.id) ? `<span class="pill ok">✅ 푼 문제</span>` : "";
  const kind = { func: "함수 작성", choice: "객관식", short: "단답" }[p.type];
  return `<div class="meta"><span class="pill gray">${esc(B.name)} · ${esc(PC.topicName(p.topic))}</span>
    <span class="pill gray">${p.level}단계 · ${esc(B.levels[p.level] || "")}</span>
    ${kind ? `<span class="pill gray">${kind}</span>` : ""}
    ${p.timeLimit && !PC.isPaper(p) ? `<span class="pill gray">⏱ 테스트당 ${p.timeLimit}초</span>` : ""} ${st}
    <span class="pill gray" style="font-family:var(--mono)">${esc(p.id)}</span></div>`;
}

function codeProblemHtml(p) {
  const isFunc = p.type === "func";
  let html = metaHtml(p) + `<h2>${esc(p.title)}</h2><div class="body">${esc(p.body)}</div>`;
  if (p.inputDesc) html += `<h3>${isFunc ? "함수 호출" : "입력"}</h3><div class="body">${esc(p.inputDesc)}</div>`;
  if (p.outputDesc) html += `<h3>${isFunc ? "돌려줄 값" : "출력"}</h3><div class="body">${esc(p.outputDesc)}</div>`;
  if (p.examples && p.examples.length) {
    html += `<h3>예시</h3>` + p.examples.map((e, i) => `<div class="ex"><div class="row">
      <div><b>${isFunc ? "호출" : "입력 " + (i + 1)}</b><pre class="io">${esc(isFunc ? e.call : (e.input || "(없음)"))}</pre></div>
      <div><b>${isFunc ? "돌려받는 값" : "출력 " + (i + 1)}</b><pre class="io">${esc(e.output)}</pre></div></div></div>`).join("");
  }
  if (p.scale) html += scaleHtml(p.scale);
  html += `<p class="tip">${isFunc ? "함수만 만들면 됩니다. 채점기가 함수를 불러 «돌려준 값» 을 확인합니다." :
    "input() 과 sys.stdin.readline() 모두 쓸 수 있습니다. 줄 끝 공백과 마지막 빈 줄은 무시합니다."}
    채점 테스트 ${(p.tests || []).length}개 중 일부는 숨겨져 있습니다.</p><div id="hintBox" class="hintBox"></div>`;
  return html;
}

/* ⏱ 실제 크기라면 — 문제를 만들 때 CPython 으로 잰 시간(정답 풀이)과 늘려 계산한 시간(느린 풀이) */
function scaleHtml(sc) {
  const lim = sc.limitSec || 1;
  const rows = (sc.estimates || []).filter((e) => e.sec != null).map((e) => {
    const over = e.sec > lim;
    return `<tr><td>${esc(e.label)}${e.how === "estimated" ? " <small>(추정)</small>" : " <small>(실제로 잰 값)</small>"}</td>
      <td class="v ${over ? "over" : "fit"}">${e.how === "estimated" && !PC.fmtSec(e.sec).startsWith("약") ? "약 " : ""}${PC.fmtSec(e.sec)}${over ? " · 시간 초과" : ""}</td></tr>`;
  }).join("");
  return `<div class="scaleBox"><b class="h">⏱ 실제 크기라면</b>
    이 문제는 <strong>${esc(sc.here)}</strong> 으로 줄였습니다. 실제 대회 크기(<strong>${esc(sc.full)}</strong>)라면 — 대회 제한 ${lim}초
    ${rows ? `<table>${rows}</table>` : ""}
    <div class="note">일반 파이썬(CPython, 대회 채점 환경에 가까움) 기준입니다. 이 화면의 브라우저 파이썬은 보통 몇 배 더 느립니다.
    «추정» 은 작은 입력으로 잰 시간을 복잡도대로 늘려 계산한 값입니다.</div>
    <div id="mineScale"></div></div>`;
}

function mineScaleHtml(sc, ms) {
  const est = PC.estimateMine(sc, ms);
  if (!est) return "";
  const lim = sc.limitSec || 1;
  return `<div style="margin-top:8px"><b>내 코드를 실제 크기로 돌리면 대략</b> <small>(가장 오래 걸린 테스트 ${ms}ms · N = ${sc.nHere.toLocaleString("ko-KR")} 기준, 브라우저)</small>
    <table>${est.map((e) => `<tr><td>내 코드가 ${e.label} 이라면</td><td class="v ${e.sec > lim ? "over" : "fit"}">${PC.fmtSec(e.sec)}</td></tr>`).join("")}</table>
    <div class="note">내 코드의 복잡도는 채점기가 알 수 없어서 가정별로 보여 줍니다. 반복문이 몇 겹인지 세어 보고 맞는 줄을 읽으세요.</div></div>`;
}

/* ---------- 1교시 (객관식·단답) ---------- */
function paperHtml(p) {
  let html = metaHtml(p) + `<h2>${esc(p.title)}</h2><div class="body">${esc(p.body)}</div>`;
  if (p.code && p.code.text) html += `<div class="codeShow"><div class="lang">${p.code.lang === "c" ? "C 언어" : "파이썬"}</div><div id="codeHost"></div></div>`;
  if (p.outputDesc) html += `<div class="body" style="margin-top:8px">${esc(p.outputDesc)}</div>`;
  if (p.type === "choice") {
    html += `<fieldset class="choices" style="border:0;padding:0"><legend class="hidden">보기</legend>` + p.choices.map((c, i) =>
      `<label><input type="radio" name="choice" value="${i + 1}"><span><strong>${"①②③④⑤⑥"[i]}</strong> ${esc(c)}</span></label>`).join("") + `</fieldset>`;
  } else {
    html += `<div class="shortAns"><input id="shortInput" aria-label="답" placeholder="답을 입력하세요" autocomplete="off"></div>`;
  }
  html += `<div class="toolbar"><button class="btn primary" id="paperBtn" type="button">✓ 답 확인</button></div>
    <div class="result" id="paperResult" style="margin-top:10px" aria-live="polite"><p class="empty" style="padding:0">답을 고르고 «답 확인» 을 누르세요. 몇 번이든 다시 낼 수 있습니다.</p></div>
    <div id="hintBox" class="hintBox"></div>`;
  return html;
}

function showCode(code) {
  const host = $("codeHost");
  if (!host) return;
  CodeMirror(host, { value: code.text, mode: code.lang === "c" ? "text/x-csrc" : "python", readOnly: true, lineNumbers: true, viewportMargin: Infinity });
}

function setupPaper(p) {
  const input = $("shortInput");
  if (input) input.addEventListener("keydown", (e) => { if (e.key === "Enter") checkPaper(p); });
  $("paperBtn").onclick = () => checkPaper(p);
}

async function checkPaper(p) {
  const ans = p.type === "choice" ? ((document.querySelector('input[name="choice"]:checked') || {}).value || "") : $("shortInput").value;
  if (!String(ans).trim()) return toast("답을 먼저 고르거나 입력하세요.");
  const box = $("paperResult");
  box.innerHTML = `<p class="empty" style="padding:0">확인 중…</p>`;
  try {
    const d = await api("/api/submit", { method: "POST", body: { problemId: p.id, answer: ans } });
    const ok = d.passed === d.total;
    record(p, d.passed, d.total);
    box.innerHTML = `<div class="score ${ok ? "ok" : "bad"}">${ok ? "🎉 정답입니다!" : "❌ 틀렸습니다. 다시 생각해 보세요."}</div>` + (ok ? nextHtml() : "");
    bindNext();
  } catch (e) { box.innerHTML = `<div class="errbox">${esc(e.message)}</div>`; }
}

/* ---------- 힌트 ---------- */
function renderHints(p) {
  const box = $("hintBox");
  if (!box) return;
  const hints = p.hints || [];
  if (!hints.length) { box.innerHTML = ""; return; }
  const n = S.revealed[p.id] || 0;
  box.innerHTML = hints.slice(0, n).map((t, i) => `<div class="hint"><b>💡 힌트 ${i + 1}</b>${esc(t)}</div>`).join("") +
    (n < hints.length ? `<button class="btn small" type="button" id="hintBtn">💡 힌트 ${n + 1} 보기</button>` : "");
  const b = $("hintBtn");
  if (b) b.onclick = () => { S.revealed[p.id] = n + 1; renderHints(p); };
}

/* ---------- 실행 · 채점 ---------- */
function updateButtons() {
  const has = !!S.current && !S.busy && !PC.isPaper(S.current);
  $("runBtn").disabled = !has;
  $("gradeBtn").disabled = !has;
}

function errHtml(r) {
  const x = PC.explain(r);
  return `<div class="errbox"><strong>${esc(x.title)}</strong>${x.line ? ` — ${x.line}번째 줄` : ""}<br>${esc(x.hint)}
    ${x.msg ? `<div class="raw">${esc(r.kind)}: ${esc(x.msg)}</div>` : ""}</div>`;
}

async function busy(fn) {
  if (S.busy) return;
  S.busy = true; updateButtons();
  $("result").innerHTML = `<p class="empty" style="padding:0">실행 중… (처음 실행은 파이썬을 불러오느라 몇 초 걸립니다)</p>`;
  try { await fn(); }
  catch (e) { $("result").innerHTML = `<div class="errbox">${esc(e.message)}</div>`; }
  finally { S.busy = false; updateButtons(); }
}

function doRun() {
  if (!S.current || $("runBtn").disabled) return;
  const p = S.current;
  busy(async () => {
    const code = S.cm.getValue();
    if (p.type === "func") {
      const ex = await PC.checkExamples(runner, p, code);
      $("result").innerHTML = `<h4>예시로 함수 불러 보기</h4>` + exampleTable(p, ex);
      return;
    }
    const [r] = await runner.run(code, [{ stdin: $("stdin").value, call: "" }], PC.timeOf(p));
    $("result").innerHTML = `<h4>실행 결과 <span class="pill gray">${r.ms}ms</span></h4>
      <pre class="io" style="background:#f6f7f9;border-radius:8px;padding:10px;min-height:2em">${esc(r.stdout) || '<span style="color:#999">(출력 없음)</span>'}</pre>
      ${r.kind ? errHtml(r) : ""}`;
  });
}

function exampleTable(p, ex) {
  if (!ex.length) return `<p class="empty" style="padding:0">예시가 없는 문제입니다.</p>`;
  const isFunc = p.type === "func";
  return `<table class="cmp"><tr><th>${isFunc ? "호출" : "입력"}</th><th>기대 결과</th><th>내 결과</th><th></th></tr>` +
    ex.map((e) => `<tr><td><pre class="io">${esc(isFunc ? e.call : (e.input || "(없음)"))}</pre></td>
      <td><pre class="io">${esc(e.expected)}</pre></td>
      <td>${e.kind ? errHtml(e) : `<pre class="io">${esc(e.actual)}</pre>`}</td>
      <td>${e.ok ? "✅" : "❌"}</td></tr>`).join("") + `</table>`;
}

function nextHtml() {
  const n = nextProblem();
  return `<div class="nextRow">${n ? `<button class="btn primary" type="button" id="nextBtn" data-id="${esc(n.id)}">다음 문제 ▶ <small>${esc(n.title)}</small></button>` : `<span class="pill ok">이 주제를 모두 풀었습니다! 🎉</span>`}
    <button class="btn" type="button" id="nextRandomBtn">🎲 무작위</button></div>`;
}
function bindNext() {
  const n = $("nextBtn"); if (n) n.onclick = () => openProblem(n.dataset.id);
  const r = $("nextRandomBtn"); if (r) r.onclick = () => $("randomBtn").click();
}

function record(p, passed, total) {
  const now = Date.now();
  const m = S.prog[p.id] || { problem_id: p.id, attempts: 0, best: 0, total, solved_at: 0, last_at: now };
  m.attempts++; m.best = Math.max(m.best, passed); m.total = total; m.last_at = now;
  if (passed === total && total > 0 && !m.solved_at) m.solved_at = now;
  S.prog[p.id] = m;
  renderSide();
  updateSolvedNum();
}

function doGrade() {
  if (!S.current || $("gradeBtn").disabled) return;
  const p = S.current;
  busy(async () => {
    const code = S.cm.getValue();
    if (!code.trim()) throw new Error("코드를 먼저 작성하세요.");
    const ex = await PC.checkExamples(runner, p, code);
    if (ex.some((e) => e.kind === "Timeout")) {
      $("result").innerHTML = `<h4>채점하지 않았습니다</h4>` + errHtml({ kind: "Timeout" }) + exampleTable(p, ex);
      return;
    }
    const g = await PC.grade(runner, p, code);
    const all = g.passed === g.total;
    let html = `<h4>채점 결과</h4><div class="score ${all ? "ok" : "bad"}">${all ? "🎉 모두 통과!" : `${g.passed} / ${g.total} 통과`}</div>
      <div class="chips">` + g.results.map((r, i) =>
        `<span class="chip ${r.ok ? "ok" : "bad"}">테스트 ${i + 1} ${r.ok ? "✓" : r.kind ? "✗ " + esc(PC.explain(r).title) : "✗ 출력 다름"} <small>${r.kind ? "" : r.ms + "ms"}</small></span>`).join("") + `</div>`;
    const firstErr = g.results.find((r) => r.kind);
    if (firstErr) html += errHtml(firstErr);
    if (ex.length && ex.some((e) => !e.ok)) html += `<h4 style="margin-top:12px">예시 비교</h4>` + exampleTable(p, ex);
    else if (!all && !firstErr) html += `<p class="tip">예시는 맞지만 숨겨진 테스트에서 틀렸습니다. 경계값(최소·최대, 0, 음수, 같은 값)을 생각해 보세요.</p>`;
    try {
      await api("/api/submit", { method: "POST", body: { problemId: p.id, code, passed: g.passed, total: g.total, ms: g.maxMs } });
      record(p, g.passed, g.total);
    } catch (e) { html += `<div class="msg warn">채점은 되었지만 기록하지 못했습니다: ${esc(e.message)}</div>`; }
    if (all) html += nextHtml();
    $("result").innerHTML = html;
    bindNext();
    if (p.scale && $("mineScale")) $("mineScale").innerHTML = all ? mineScaleHtml(p.scale, g.maxMs) : "";
  });
}

$("runBtn").onclick = doRun;
$("gradeBtn").onclick = doGrade;
$("resetBtn").onclick = async () => {
  if (!S.current) return;
  if (!(await confirmBox("처음 코드로", "지금 쓴 코드를 지우고 처음 코드로 돌립니다."))) return;
  S.cm.setValue(S.current.starter || "");
};

/* ---------- 내 기록 ---------- */
function dayKey(t) { const d = new Date(t); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
$("statsBtn").onclick = () => {
  const solved = Object.values(S.prog).filter((m) => m.solved_at);
  const now = Date.now();
  const week = solved.filter((m) => now - m.solved_at < 7 * 86400000).length;
  const days = new Set(solved.map((m) => dayKey(m.solved_at)));
  let streak = 0;
  const d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);   // 오늘 아직 안 풀었으면 어제부터 센다
  while (days.has(dayKey(d))) { streak++; d.setDate(d.getDate() - 1); }
  let html = `<div class="stats"><div class="stat"><b>${solved.length}</b><span>푼 문제</span></div>
    <div class="stat"><b>${week}</b><span>최근 7일</span></div><div class="stat"><b>${streak}일</b><span>연속으로 푼 날</span></div></div>`;
  for (const b of ["pyclub", "pycoding"]) {
    const inBank = S.list.filter((p) => p.bank === b);
    if (!inBank.length) continue;
    html += `<h4 style="margin:12px 0 4px">${b === "pyclub" ? "🧩 동아리 문제" : "🐍 pycoding 문제"}</h4>`;
    for (const t of PC.BANKS[b].topics) {
      const all = inBank.filter((p) => p.topic === t.key);
      if (!all.length) continue;
      const done = all.filter((p) => isSolved(p.id)).length;
      html += `<div class="prow"><span>${t.name}</span><div class="bar"><i style="width:${(100 * done / all.length).toFixed(1)}%"></i></div><span class="v">${done}/${all.length}</span></div>`;
      if (b === "pyclub") {
        html += `<div style="display:flex;gap:4px;flex-wrap:wrap;margin:0 0 6px 98px">` + Object.keys(PC.BANKS[b].levels).map((lv) => {
          const ps = all.filter((p) => String(p.level) === lv);
          return ps.length ? `<span class="pill gray">${lv}단계 ${ps.filter((p) => isSolved(p.id)).length}/${ps.length}</span>` : "";
        }).join("") + `</div>`;
      }
    }
  }
  $("statsBody").innerHTML = html;
  $("statsDlg").showModal();
};

/* ---------- 작은 도구 ---------- */
function toast(text) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = text; t.setAttribute("role", "status");
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function confirmBox(title, html, okText = "확인") {
  return new Promise((resolve) => {
    const dlg = $("confirmDlg");
    $("confirmTitle").textContent = title;
    $("confirmBody").innerHTML = html;
    $("confirmYes").textContent = okText;
    const done = (v) => { dlg.close(); $("confirmYes").onclick = $("confirmNo").onclick = null; resolve(v); };
    $("confirmYes").onclick = () => done(true);
    $("confirmNo").onclick = () => done(false);
    dlg.oncancel = () => done(false);
    dlg.showModal();
  });
}
window.addEventListener("beforeunload", saveDraft);
initLogin();
</script>
