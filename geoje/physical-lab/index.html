<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>센서 공작소 — 연결 실습</title>
<link rel="stylesheet" href="css/app.css?v=202608300044">
</head>
<body>

<header class="top">
  <h1><a href="index.html">🔧 센서 공작소</a></h1>
  <span class="badge">확장보드에 센서 연결하기</span>
  <span class="sp"></span>
  <a class="lnk" href="teacher.html">선생님용 ▸</a>
</header>

<div class="wrap">

  <!-- ── 시작 화면 : 주소로 들어오면 이것만 보인다 ─────────────────
       6자리 숫자를 넣으면 그 ② 연결 문제로 들어간다. 문제를 받기 전에
       보드·부품을 미리 보여 주면 무엇을 해야 하는지 헷갈린다(그래서 감춰 둔다). -->
  <div class="card startcard" id="startCard">
    <h2>선생님이 알려 준 <b>6자리 숫자</b>를 넣으세요</h2>
    <div class="row">
      <input type="text" id="code6" class="big6" inputmode="numeric" maxlength="7"
             placeholder="- - - - - -" aria-label="6자리 숫자 코드" autocomplete="off">
      <button id="btnGo6" class="pri big">시작하기 ▶</button>
    </div>
    <p class="hint" id="code6msg">여섯 자리를 다 넣으면 저절로 시작합니다.</p>
    <hr style="border:none;border-top:1px solid var(--line);margin:16px 0">
    <div class="row">
      <span class="hint">번호가 없으면 먼저 연습해 볼 수 있습니다.</span>
      <button id="btnDemo">🔰 보기 문제로 연습하기</button>
    </div>
  </div>

  <!-- ── 문제를 받은 뒤 보이는 것 ───────────────────────── -->
  <div id="playWrap" hidden>
    <div class="card">
      <div class="scorebar">
        <b id="probTitle" style="font-size:19px">연결 문제</b>
        <span class="sp" style="flex:1"></span>
        <span class="hint">준비물 — <span id="prep"></span></span>
      </div>
    </div>

    <!-- 문제 내용이 여기에 탭으로 붙는다 (js/lessonview.js 의 LessonView.mount).
         연결만 있는 문제면 ② 연결 하나만, 코딩·학습지 등이 들어 있으면 그 탭도 함께 보인다. -->
    <div id="lessonSteps"></div>
    <div id="lessonBody"></div>

    <!-- 다른 문제 열기 -->
    <div class="card">
      <div class="row">
        <b>다른 문제 열기</b>
        <input type="text" id="code6b" class="mid6" inputmode="numeric" maxlength="7"
               placeholder="6자리 숫자" aria-label="다른 문제의 6자리 숫자 코드" autocomplete="off">
        <button id="btnGo6b" class="pri">열기 ▶</button>
        <span class="hint" id="code6bmsg"></span>
        <span style="flex:1"></span>
        <button id="btnBackStart" class="gh">처음 화면으로</button>
      </div>
    </div>
  </div>

</div>

<script src="js/config.js?v=202608300044"></script>
<script src="js/connect/parts.js?v=202608300044"></script>
<script src="js/connect/board.js?v=202608300044"></script>
<script src="js/connect/judge.js?v=202608300044"></script>
<script src="js/connect/connect.js?v=202608300044"></script>
<!-- 공용 부품 (자유 문제에 코딩·학습지 등이 들어 있을 때 쓴다) -->
<script src="js/pdf.js?v=202608300044"></script>
<script src="js/print.js?v=202608300044"></script>
<script src="js/ui.js?v=202608300044"></script>
<script src="js/blocks.js?v=202608300044"></script>
<script src="js/bench.js?v=202608300044"></script>
<script src="js/worksheet.js?v=202608300044"></script>
<script src="js/studio.js?v=202608300044"></script>
<script src="js/lessonview.js?v=202608300044"></script>
<script src="js/code.js?v=202608300044"></script>
<script src="js/student.js?v=202608300044"></script>
<script>Student.boot();</script>
</body>
</html>
