<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업용 웹앱 모음</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23103b6f'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='18' font-weight='bold' text-anchor='middle' fill='%23ffffff'%3E%E2%98%B0%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 60px 24px 80px;
    font-family: "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    color: #1b2430;
    /* 은은한 파랑 그러데이션 */
    background: linear-gradient(170deg, #eaf1fb 0%, #f6f9fd 45%, #eef3fa 100%);
    background-attachment: fixed;
  }

  .wrap { max-width: 1080px; margin: 0 auto; }

  /* ===== 머리말 ===== */
  header { text-align: center; margin-bottom: 44px; }
  h1 {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -1.2px;
    margin: 0 0 8px;
    color: #0e2f59;
  }
  .sub {
    margin: 0;
    font-size: 16px;
    color: #7286a0;
    letter-spacing: -.3px;
  }

  /* ===== 구분 3열 ===== */
  .cols {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    align-items: start;
  }

  .col {
    background: #fff;
    border: 1px solid #e2eaf5;
    border-radius: 20px;
    padding: 24px 20px 22px;
    box-shadow: 0 2px 6px rgba(16, 59, 111, .05);
  }

  /* 열 제목 — 아이콘은 여기에만 넣는다 */
  .col h2 {
    display: flex;
    align-items: center;
    gap: 11px;
    margin: 0 0 18px;
    padding-bottom: 14px;
    border-bottom: 2px solid #eef3fa;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -.6px;
    color: #0e2f59;
  }
  .col h2 .ico {
    flex: none;
    width: 40px; height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 13px;
    background: linear-gradient(145deg, #eef4fc, #dfeafa);
    font-size: 20px;
  }

  /* ===== 목록 : 글자만 ===== */
  ul { list-style: none; margin: 0; padding: 0; }
  li { margin-bottom: 8px; }
  li:last-child { margin-bottom: 0; }

  li a {
    position: relative;
    display: block;
    overflow: hidden;
    padding: 14px 16px;
    border: 1px solid #e8eff8;
    border-radius: 13px;
    background: #fbfdff;
    text-decoration: none;
    color: #16375f;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -.4px;
    line-height: 1.45;
    transition: background .16s ease, border-color .16s ease, transform .16s ease;
  }
  /* 왼쪽 세로 띠 : 마우스를 올리면 나타난다 */
  li a::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, #2f7bd6, #103b6f);
    transform: translateX(-4px);
    transition: transform .16s ease;
  }
  li a:hover {
    background: #f1f7fe;
    border-color: #bcd4ef;
    transform: translateX(2px);
  }
  li a:hover::before { transform: translateX(0); }

  /* 아직 비어 있는 열 */
  .empty {
    margin: 0;
    padding: 16px 0 6px;
    text-align: center;
    font-size: 15px;
    color: #a7b6c9;
    letter-spacing: -.3px;
  }

  /* 좁은 화면에서는 열을 위아래로 세운다 */
  @media (max-width: 860px) {
    .cols { grid-template-columns: 1fr; gap: 16px; }
    body { padding: 44px 16px 60px; }
    h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>수업용 웹앱 모음</h1>
    <p class="sub">필요한 것을 골라 여세요</p>
  </header>

  <div class="cols">

    <!-- ① 정보교과 : 앱을 추가할 때는 li 한 줄만 늘린다 -->
    <section class="col">
      <h2><span class="ico">💻</span>정보교과</h2>
      <ul>
        <li><a href="abstraction-algo/">추상화와 알고리즘</a></li>
        <li><a href="ai-class/">인공지능의 이해와 활용</a></li>
        <li><a href="mb-bluetooth/">스마트하우스, 선 없이 잇기</a></li>
        <li><a href="mb-connect/">마이크로비트 연결 시뮬레이터</a></li>
        <li><a href="data-convert/">아날로그 → 디지털 변환 학습기</a></li>
      </ul>
    </section>

    <!-- ② 업무용 -->
    <section class="col">
      <h2><span class="ico">📋</span>업무용</h2>
      <ul>
        <li><a href="eduform/">에듀폼 — 학생 평가·기록 관리</a></li>
        <li><a href="ai-coordinator/">AI교육 코디네이터 업무 관리</a></li>
        <li><a href="pdf-split/">PDF 도구 — 자르기 · 붙이기 · 변환 · 편집 · 보안</a></li>
        <li><a href="cable-label/">라벨 만들기 — 라벨지에 맞춰 이름 인쇄</a></li>
      </ul>
    </section>

    <!-- ③ 기타 -->
    <section class="col">
      <h2><span class="ico">🗂️</span>기타</h2>
      <ul>
        <li><a href="pdf-worksheet/">활동지 — 펜으로 쓰고 내기</a></li>
      </ul>
    </section>

  </div>

</div>
</body>
</html>
