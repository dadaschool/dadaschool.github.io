<!doctype html>

<!-- 클로드 중급과정 10차시 «결과 예시». 한 파일 · 인터넷 없이 열린다. 연수용 가상 자료.
     카드는 SVG로 그렸고, «PNG로 저장» 단추가 브라우저 안에서 SVG → 캔버스 → PNG 로 바꿔 내려받는다(외부 라이브러리 없음).
     통계 수치는 넣지 않고 일반적인 실천 방법만 담았다. -->
<style>
  :root{--bg:#F3EEE5; --ink:#1F2A2E; --muted:#5E6B6E; --teal:#0F5257; --line:#DDD3C2}
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
       font-size:17px; line-height:1.6; word-break:keep-all}
  .wrap{max-width:1240px; margin:0 auto; padding:24px 16px 48px}
  h1{font-size:clamp(24px,4vw,32px); margin:0 0 4px}
  h2{font-size:21px; margin:34px 0 10px}
  .sub{color:var(--muted); margin:0 0 14px}
  .bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:10px 0 18px}
  button{font:inherit; font-weight:800; font-size:15.5px; color:#fff; background:var(--teal); border:0; border-radius:10px; padding:8px 14px; cursor:pointer}
  button:focus-visible{outline:3px solid #E8743B; outline-offset:3px}
  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:16px}
  @media (max-width:980px){ .cards{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:480px){ .cards{grid-template-columns:1fr} }
  figure{margin:0}
  figure svg{display:block; width:100%; height:auto; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.12); background:#fff}
  figcaption{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; color:var(--muted); font-size:14.5px}
  .msg{color:var(--teal); font-weight:700; min-height:1.6em}
  .note{color:var(--muted); font-size:14.5px; margin-top:24px}
</style>
</head>
<body>
<div class="wrap">

  <figure class="dia"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" role="img" aria-label="개념 도식: 가운데 가정의 에너지 절약에서 전기, 냉난방, 가전제품 세 갈래로 나뉘고, 갈래마다 실천 방법 세 가지가 이어진다. 맨 위에는 왜 아껴야 할까 — 에너지 자원 아끼기, 온실가스 줄이기, 전기 요금 줄이기." id="diagram"><rect width="1600" height="1000" fill="#FFF8EC"/><path d="M800 158 V270" stroke="#5E6B6E" stroke-width="5" stroke-dasharray="4 10" stroke-linecap="round"/><path d="M800 390 C800 480 270 480 270 575" fill="none" stroke="#E8743B" stroke-width="8"/><path d="M270 665 V875" stroke="#E8743B" stroke-width="5"/><path d="M800 390 C800 480 800 480 800 575" fill="none" stroke="#1B7A80" stroke-width="8"/><path d="M800 665 V875" stroke="#1B7A80" stroke-width="5"/><path d="M800 390 C800 480 1330 480 1330 575" fill="none" stroke="#0F5257" stroke-width="8"/><path d="M1330 665 V875" stroke="#0F5257" stroke-width="5"/><rect x="210.0" y="62.0" width="1180" height="96" rx="26" fill="#fff" stroke="#EADFCB" stroke-width="3"/><text x="800" y="121.52" font-size="32" font-weight="700" fill="#1F2A2E" text-anchor="middle">왜 아껴야 할까?  에너지 자원 아끼기 · 온실가스 줄이기 · 전기 요금 줄이기</text><rect x="570.0" y="270.0" width="460" height="120" rx="26" fill="#1F2A2E"/><text x="800" y="347.28" font-size="48" font-weight="800" fill="#fff" text-anchor="middle">가정의 에너지 절약</text><rect x="140.0" y="575.0" width="260" height="90" rx="26" fill="#E8743B"/><text x="270" y="635.12" font-size="42" font-weight="800" fill="#fff" text-anchor="middle">전기</text><rect x="40.0" y="695.0" width="460" height="70" rx="26" fill="#fff" stroke="#E8743B" stroke-width="3"/><text x="270" y="740.44" font-size="29" font-weight="600" fill="#1F2A2E" text-anchor="middle">멀티탭 스위치 끄기</text><rect x="40.0" y="785.0" width="460" height="70" rx="26" fill="#fff" stroke="#E8743B" stroke-width="3"/><text x="270" y="830.44" font-size="29" font-weight="600" fill="#1F2A2E" text-anchor="middle">다 쓴 충전기   <p class="note">카드에는 통계 수치를 넣지 않고 일반적인 실천 방법만 담았습니다. 숫자를 넣을 때는 출처(기관·연도)를 함께 적습니다. «PNG로 저장»은 인터넷 없이 브라우저 안에서 바뀝니다. 여러 장을 한 번에 저장할 때 브라우저가 «여러 파일 다운로드»를 물으면 허용합니다.</p>
</div>
<script>
(function(){
  var msg = document.getElementById('msg');
  function save(id, w, h, name){
    return new Promise(function(done){
      var svg = document.getElementById(id).cloneNode(true);
      svg.setAttribute('width', w); svg.setAttribute('height', h);
      var src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svg));
      var img = new Image();
      img.onload = function(){
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(function(b){
          var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
          msg.textContent = name + ' 저장 ✓'; done();
        }, 'image/png');
      };
      img.onerror = function(){ msg.textContent = '바꾸지 못했습니다. 크롬이나 엣지에서 열어 주세요.'; done(); };
      img.src = src;
    });
  }
  document.querySelectorAll('button[data-png]').forEach(function(b){
    b.addEventListener('click', function(){ save(b.dataset.png, +b.dataset.w, +b.dataset.h, b.dataset.name); });
  });
  document.getElementById('all').addEventListener('click', function(){
    var bs = Array.prototype.slice.call(document.querySelectorAll('.cards button[data-png]'));
    bs.reduce(function(p, b){ return p.then(function(){ return save(b.dataset.png, +b.dataset.w, +b.dataset.h, b.dataset.name); }).then(function(){ return new Promise(function(r){ setTimeout(r, 400); }); }); }, Promise.resolve())
      .then(function(){ msg.textContent = '카드 4장 저장 ✓'; });
  });
})();
</script>
